/* Layout: one column app shell, 640px max. Evening-concert-hall look: deep emerald-black ground with a
   soft green glow at the top, warm copper for anything you can press, spaced engraved capitals for
   titles, quiet translucent panels. A single deliberate dark look in every theme. */
:root {
  --bg: #0A1311;
  --glow: #12483A;
  --surface: #111D1A;
  --surface-2: #182824;
  --line: rgba(232, 214, 190, 0.08);
  --fill: rgba(232, 214, 190, 0.07);
  --fg: #F2ECE3;
  --fg-2: #9FA9A3;
  --fg-3: #5B6762;
  --sep: rgba(232, 214, 190, 0.09);
  --accent: #DDA778;
  --accent-fill: #D29D70;
  --accent-solid: #D49A6A;
  --accent-soft: rgba(221, 167, 120, 0.12);
  --on-accent: #1E140C;
  --emerald: #1D6B54;
  --danger: #EE8577;
  --good: #7FD3A6;
  --warn: #EBB65A;
  --bar: rgba(10, 19, 17, 0.78);
  --scrim: rgba(2, 6, 5, 0.66);
  --shadow: none;
  --panel-strong: #10302A;
  --mix: 22%;
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --font-display: "Marcellus", -apple-system, BlinkMacSystemFont, "SF Pro Display", system-ui, "Segoe UI", Roboto, sans-serif;
  --font-round: "Marcellus", "Iowan Old Style", Palatino, Georgia, serif;
  --sat: env(safe-area-inset-top, 0px);
  --sab: env(safe-area-inset-bottom, 0px);
  --r: 18px;
  --ease: cubic-bezier(0.32, 0.72, 0, 1);
  color-scheme: dark;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html { -webkit-text-size-adjust: 100%; background: var(--bg); }
body {
  margin: 0; background: var(--bg); color: var(--fg);
  font-family: var(--font); font-size: 17px; line-height: 1.38; letter-spacing: -0.005em;
  -webkit-font-smoothing: antialiased; overscroll-behavior-y: none; position: relative;
}
body::before {
  content: ""; position: fixed; inset: 0; z-index: -1; pointer-events: none;
  background: linear-gradient(180deg, rgba(18, 72, 58, 0.22) 0%, transparent 320px);
}
button, input, select, textarea { font: inherit; color: inherit; letter-spacing: inherit; }
button { background: none; border: 0; padding: 0; cursor: pointer; text-align: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 10px; }
svg.i { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.num { font-variant-numeric: tabular-nums; }
.caps { font-family: var(--font-display); text-transform: uppercase; letter-spacing: 0.18em; }

#app { max-width: 640px; margin: 0 auto; min-height: 100vh; padding-bottom: calc(104px + var(--sab)); }

/* ---------- Navigation bar + title ---------- */
.navbar {
  position: sticky; top: 0; z-index: 20;
  padding: var(--sat) 8px 0; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; min-height: calc(48px + var(--sat));
  transition: background-color .25s, box-shadow .25s;
}
.navbar.scrolled { background: var(--bar); -webkit-backdrop-filter: saturate(160%) blur(22px); backdrop-filter: saturate(160%) blur(22px); box-shadow: 0 1px 0 var(--line); }
.nav-title { font-family: var(--font-display); text-transform: uppercase; letter-spacing: 0.2em; font-size: 13px; opacity: 0; transition: opacity .2s; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 56vw; }
.navbar.scrolled .nav-title, .navbar.pinned .nav-title { opacity: 1; }
.nav-l, .nav-r { display: flex; gap: 4px; align-items: center; }
.nav-r { justify-content: flex-end; }
.nav-btn { color: var(--accent); min-height: 44px; min-width: 44px; padding: 0 10px; display: inline-flex; align-items: center; justify-content: center; gap: 2px; font-size: 16px; border-radius: 99px; }
.nav-btn:active { opacity: .45; }
.nav-btn.strong { font-weight: 600; }
.nav-l .nav-btn:has(svg):not(.back), .nav-r .nav-btn:has(svg) { width: 40px; min-width: 40px; height: 40px; min-height: 40px; padding: 0; margin: 2px 4px; border: 1px solid var(--line); background: rgba(255,255,255,0.03); }
.nav-btn svg.i { width: 22px; height: 22px; }
.nav-btn.back { padding-left: 2px; }
.nav-btn.back svg.i { width: 26px; height: 26px; margin-right: -2px; }

.large { padding: 6px 20px 18px; text-align: center; }
.large .eyebrow { margin: 0 0 8px; font-size: 11px; font-weight: 500; letter-spacing: 0.28em; text-transform: uppercase; color: var(--accent); }
.large h1 { margin: 0; font-family: var(--font-display); font-weight: 400; font-size: 30px; line-height: 1.15; letter-spacing: 0.16em; text-transform: uppercase; text-wrap: balance; }

main { padding: 0 16px; display: flex; flex-direction: column; gap: 30px; }
.section { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.section-h { display: flex; align-items: baseline; justify-content: space-between; padding: 0 6px; gap: 12px; }
.section-h h2 { margin: 0; font-family: var(--font-display); font-weight: 400; font-size: 14px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--fg); }
.section-h .meta { font-size: 13px; color: var(--fg-2); }
.section-h .link { color: var(--accent); font-size: 14px; }
.footnote { font-size: 13px; color: var(--fg-2); padding: 0 16px; margin: 0; text-align: center; text-wrap: balance; }

/* ---------- Panels and lists ---------- */
.group { background: var(--surface); border-radius: var(--r); overflow: hidden; box-shadow: inset 0 0 0 1px var(--line); }
.row {
  display: flex; align-items: center; gap: 12px; width: 100%; min-height: 54px; padding: 11px 16px;
  position: relative; background: transparent;
}
.row + .row::before { content: ""; position: absolute; top: 0; right: 16px; left: var(--inset, 16px); height: 1px; background: var(--sep); }
button.row:active, a.row:active { background: var(--surface-2); }
a.row { color: inherit; text-decoration: none; }
.row .grow { flex: 1; min-width: 0; }
.row .title { font-size: 17px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row .sub { font-size: 14px; color: var(--fg-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row .trail { color: var(--fg-2); font-size: 14px; display: flex; align-items: center; gap: 4px; flex: none; }
.row .chev { color: var(--fg-3); width: 18px; height: 18px; stroke-width: 2; }
.row > svg.i:first-child { color: var(--accent); }
.empty { padding: 26px 16px; color: var(--fg-2); font-size: 15px; text-align: center; }

.avatar {
  --c: var(--accent); width: 42px; height: 42px; border-radius: 50%; flex: none;
  display: grid; place-items: center; font-size: 15px; letter-spacing: 0.06em;
  color: color-mix(in srgb, var(--c) 65%, #fff); background: color-mix(in srgb, var(--c) 20%, var(--surface));
  box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--c) 28%, transparent);
  font-family: var(--font-display);
}
.avatar.lg { width: 96px; height: 96px; font-size: 34px; box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--c) 30%, transparent), 0 0 0 6px var(--bg), 0 0 0 7px rgba(221,167,120,0.28); }

/* Lesson rows */
.lesson-row { --inset: 86px; gap: 12px; }
.lr-time { width: 54px; flex: none; display: flex; flex-direction: column; font-variant-numeric: tabular-nums; }
.lr-time span { font-size: 15px; font-weight: 600; }
.lr-time small { font-size: 12px; color: var(--fg-2); }
.lr-bar { width: 3px; align-self: stretch; border-radius: 2px; background: var(--c); flex: none; }
.lesson-row.off .lr-bar { background: var(--fg-3); box-shadow: none; }
.lesson-row.off .title { color: var(--fg-2); text-decoration: line-through; text-decoration-color: var(--fg-3); }

.pill { font-size: 11px; font-weight: 600; padding: 4px 9px; border-radius: 99px; white-space: nowrap; flex: none; letter-spacing: 0.14em; text-transform: uppercase; }
.pill.taught { color: var(--good); background: rgba(127, 211, 166, 0.1); }
.pill.live { color: var(--on-accent); background: var(--accent-fill); }
.pill.cancelled { color: var(--fg-2); background: var(--fill); }
.pill.missed { color: var(--warn); background: rgba(235, 182, 90, 0.12); }

/* ---------- Today: the "Up next" showcase ---------- */
.hero {
  border-radius: 28px; padding: 22px 20px 20px; display: flex; flex-direction: column; align-items: center; gap: 14px; text-align: center;
  background: var(--panel-strong);
  box-shadow: inset 0 0 0 1px rgba(232, 214, 190, 0.08); position: relative; overflow: hidden;
}
.hero-top { display: flex; flex-direction: column; align-items: center; gap: 4px; }
.hero-label { font-family: var(--font-display); font-size: 12px; letter-spacing: 0.3em; text-transform: uppercase; color: var(--fg-2); }
.hero-label.now { color: var(--accent); }
.hero-when { font-size: 14px; color: var(--accent); font-variant-numeric: tabular-nums; }
.hero-who { display: flex; flex-direction: column; align-items: center; gap: 12px; text-align: center; color: inherit; }
.hero-who .avatar { width: 80px; height: 80px; font-size: 28px; }
.hero-name { font-family: var(--font-display); font-size: 26px; letter-spacing: 0.14em; text-transform: uppercase; line-height: 1.2; text-wrap: balance; }
.hero-meta { font-size: 14px; color: var(--fg-2); margin-top: 4px; }
.hero-actions { display: flex; gap: 10px; flex-wrap: wrap; width: 100%; margin-top: 4px; }
.progress { height: 3px; width: 100%; border-radius: 2px; background: rgba(255,255,255,0.08); overflow: hidden; }
.progress > i { display: block; height: 100%; background: var(--accent-fill); border-radius: 2px; }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; padding: 0 22px;
  border-radius: 99px; font-weight: 600; font-size: 13px; letter-spacing: 0.16em; text-transform: uppercase; text-decoration: none; flex: 1 1 auto;
}
.btn svg.i { width: 18px; height: 18px; }
.btn.fill { background: var(--accent-fill); color: var(--on-accent); }
.btn.tint { background: transparent; color: var(--accent); box-shadow: inset 0 0 0 1px rgba(221, 167, 120, 0.35); }
.btn.plain { color: var(--fg-2); }
.btn.danger { background: rgba(238, 133, 119, 0.08); color: var(--danger); box-shadow: inset 0 0 0 1px rgba(238, 133, 119, 0.28); }
.btn:active { opacity: .75; transform: scale(.98); }
.btn.block { width: 100%; }

.tiles { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.tile { background: var(--surface); border-radius: var(--r); padding: 14px 12px 13px; display: flex; flex-direction: column; align-items: center; text-align: center; gap: 3px; min-width: 0; box-shadow: inset 0 0 0 1px var(--line); }
.tile .k { font-size: 11px; color: var(--fg-2); letter-spacing: 0.1em; text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
.tile .v { font-family: var(--font-display); font-size: 27px; font-weight: 300; letter-spacing: -0.01em; font-variant-numeric: tabular-nums; line-height: 1.15; margin-top: 2px; }
.tile .v small { font-family: var(--font); font-size: 13px; color: var(--accent); margin-left: 3px; }
.tile .s { font-size: 12px; color: var(--fg-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }

.banner { display: flex; gap: 12px; align-items: flex-start; background: var(--surface); box-shadow: inset 0 0 0 1px rgba(221,167,120,0.2); border-radius: var(--r); padding: 16px 14px 16px 18px; }
.banner .grow { flex: 1; min-width: 0; font-size: 15px; }
.banner strong { display: block; font-family: var(--font-display); font-weight: 400; font-size: 13px; letter-spacing: 0.18em; text-transform: uppercase; margin-bottom: 6px; color: var(--accent); }
.banner p { margin: 0; color: var(--fg-2); }
.banner b { color: var(--fg); }
.banner .x { color: var(--fg-2); width: 30px; height: 30px; display: grid; place-items: center; border-radius: 50%; background: var(--fill); flex: none; }
.banner .x svg.i { width: 15px; height: 15px; stroke-width: 2.2; }
.banner .actions { display: flex; gap: 8px; margin-top: 12px; }
.banner .actions .btn { min-height: 38px; padding: 0 18px; font-size: 11px; flex: none; }
.share-glyph { display: inline-block; vertical-align: -3px; width: 17px; height: 17px; color: var(--accent); }

/* ---------- Segmented control ---------- */
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; background: rgba(255,255,255,0.035); box-shadow: inset 0 0 0 1px var(--line); border-radius: 99px; padding: 3px; gap: 2px; }
.seg button { min-height: 36px; border-radius: 99px; font-size: 12px; font-weight: 600; letter-spacing: 0.16em; text-transform: uppercase; text-align: center; color: var(--fg-2); transition: background-color .2s, color .2s; }
.seg button[aria-pressed="true"] { background: var(--accent-fill); color: var(--on-accent); }

/* ---------- Calendar ---------- */
.cal-head { display: flex; flex-direction: column; gap: 14px; padding: 0 16px 14px; }
.cal-period { display: flex; align-items: center; justify-content: space-between; gap: 8px; min-height: 38px; }
.cal-period .meta { font-size: 14px; color: var(--fg-2); }
.stepper { display: flex; gap: 6px; }
.stepper button { width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; color: var(--accent); box-shadow: inset 0 0 0 1px rgba(221,167,120,0.3); background: rgba(255,255,255,0.03); }
.stepper button svg.i { width: 18px; height: 18px; stroke-width: 2; }

.weekstrip { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; padding: 0 12px 10px; }
.ws-day { display: flex; flex-direction: column; align-items: center; gap: 5px; padding: 8px 0; border-radius: 99px; }
.ws-day .dw { font-size: 10px; font-weight: 600; color: var(--fg-2); letter-spacing: 0.16em; text-transform: uppercase; }
.ws-day .dn { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; font-size: 18px; font-weight: 300; font-variant-numeric: tabular-nums; }
.ws-day.today .dn { color: var(--accent); box-shadow: inset 0 0 0 1px rgba(221,167,120,0.45); }
.ws-day.sel { background: rgba(255,255,255,0.04); box-shadow: inset 0 0 0 1px var(--line); }
.ws-day.sel .dn { background: var(--accent-fill); color: var(--on-accent); box-shadow: none; }
.ws-dots { display: flex; gap: 3px; height: 5px; }
.ws-dots i { width: 5px; height: 5px; border-radius: 50%; background: var(--c); }

.timeline-wrap { padding: 0 16px; }
.timeline { position: relative; background: var(--surface); border-radius: var(--r); overflow: hidden; box-shadow: inset 0 0 0 1px var(--line); }
.tl-hours { position: absolute; inset: 0; pointer-events: none; }
.tl-hour { position: absolute; left: 0; right: 0; height: 0; border-top: 1px solid var(--sep); }
.tl-hour span { position: absolute; left: 10px; top: -8px; font-size: 11px; color: var(--fg-3); background: var(--surface); padding: 0 4px; font-variant-numeric: tabular-nums; letter-spacing: 0.04em; }
.tl-hour.first span { top: 4px; }
.tl-cols { position: absolute; inset: 0 0 0 58px; display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); }
.tl-col { position: relative; height: 100%; cursor: copy; }
.tl-col + .tl-col { border-left: 1px solid var(--sep); }
.tl-col.today-col, .tl-col.campus.today-col { background: rgba(221, 167, 120, 0.07); }
.ev {
  position: absolute; left: 2px; right: 3px; border-radius: 10px; padding: 5px 8px; overflow: hidden; cursor: pointer;
  background: color-mix(in srgb, var(--c) 20%, var(--surface));
  box-shadow: inset 3px 0 0 var(--c);
  display: flex; flex-direction: column; gap: 1px; text-align: left; color: var(--fg);
}
.ev:active { filter: brightness(1.15); }
.ev .t { font-size: 13px; font-weight: 600; line-height: 1.2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ev .m { font-size: 11px; color: color-mix(in srgb, var(--fg) 70%, transparent); line-height: 1.25; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-variant-numeric: tabular-nums; }
.ev.off { opacity: .45; }
.ev.off .t { text-decoration: line-through; }
.ev.done::after { content: ""; position: absolute; right: 7px; top: 7px; width: 6px; height: 6px; border-radius: 50%; background: var(--good); }
.week .ev { padding: 3px 4px; border-radius: 6px; left: 1px; right: 1px; box-shadow: inset 2px 0 0 var(--c); }
.week .ev .t { font-size: 11px; }
.week .ev .m { font-size: 10px; }
.week .ev.done::after { right: 3px; top: 3px; width: 5px; height: 5px; }
.week-head { display: grid; grid-template-columns: 58px repeat(7, minmax(0, 1fr)); padding: 0 16px 8px; }
.week-head button { display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 4px 0; border-radius: 12px; }
.week-head .dw { font-size: 10px; font-weight: 600; color: var(--fg-2); text-transform: uppercase; letter-spacing: 0.14em; }
.week-head .dn { width: 30px; height: 30px; display: grid; place-items: center; border-radius: 50%; font-size: 16px; font-weight: 400; font-variant-numeric: tabular-nums; }
.week-head .today .dn { background: var(--accent-fill); color: var(--on-accent); }
.week-head .load { font-size: 10px; color: var(--accent); font-variant-numeric: tabular-nums; }
.now-line { position: absolute; left: 0; right: 0; height: 0; border-top: 1.5px solid var(--accent-solid); z-index: 3; pointer-events: none; }
.now-line::before { content: ""; position: absolute; left: -5px; top: -5.5px; width: 9px; height: 9px; border-radius: 50%; background: var(--accent-solid); }
.now-tag { position: absolute; left: 4px; z-index: 3; transform: translateY(-50%); font-size: 11px; font-weight: 700; color: var(--on-accent); background: var(--accent-fill); padding: 2px 6px; border-radius: 99px; font-variant-numeric: tabular-nums; pointer-events: none; }

.month { padding: 0 16px; }
.month-grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); background: var(--surface); border-radius: var(--r); overflow: hidden; box-shadow: inset 0 0 0 1px var(--line); }
.mg-dow { font-size: 10px; font-weight: 600; color: var(--fg-2); text-align: center; padding: 12px 0 6px; text-transform: uppercase; letter-spacing: 0.16em; }
.mg-day { min-height: 64px; padding: 6px 4px; display: flex; flex-direction: column; align-items: center; gap: 5px; border-top: 1px solid var(--sep); }
.mg-day .dn { width: 30px; height: 30px; display: grid; place-items: center; border-radius: 50%; font-size: 16px; font-weight: 300; font-variant-numeric: tabular-nums; }
.mg-day.other .dn { color: var(--fg-3); }
.mg-day.today .dn { color: var(--accent); box-shadow: inset 0 0 0 1px rgba(221,167,120,0.5); }
.mg-day.sel .dn { background: var(--accent-fill); color: var(--on-accent); box-shadow: none; }
.mg-dots { display: flex; flex-wrap: wrap; justify-content: center; gap: 3px; max-width: 36px; }
.mg-dots i { width: 5px; height: 5px; border-radius: 50%; background: var(--c); }
.mg-count { font-size: 10px; color: var(--fg-2); font-variant-numeric: tabular-nums; }
.month-list { margin-top: 22px; }

/* ---------- Plain controls ---------- */
.nav-pill { color: var(--accent); box-shadow: inset 0 0 0 1px rgba(221, 167, 120, 0.4); border-radius: 99px; padding: 0 14px; min-height: 36px; margin: 4px; font-size: 15px; font-weight: 600; display: inline-flex; align-items: center; }
.nav-pill:active { opacity: .5; }
.tp { display: flex; align-items: center; gap: 6px; flex: none; }
.field .tp select { flex: none; min-width: 66px; text-align: center; text-align-last: center; background: rgba(255,255,255,0.06); border-radius: 10px; padding: 7px 10px; font-size: 18px; font-variant-numeric: tabular-nums; }
.tp b { color: var(--fg-2); font-weight: 600; }
details.more { border-radius: var(--r); }
details.more > summary { list-style: none; cursor: pointer; color: var(--accent); font-size: 16px; padding: 4px 18px; display: flex; align-items: center; gap: 6px; }
details.more > summary::-webkit-details-marker { display: none; }
details.more > summary::after { content: "›"; font-size: 20px; transition: transform .2s; }
details.more[open] > summary::after { transform: rotate(90deg); }
details.more[open] > summary { margin-bottom: 14px; }
details.more > div { display: flex; flex-direction: column; gap: 24px; }
.steps { display: flex; flex-direction: column; }
.step { display: flex; align-items: center; gap: 14px; }
.step .n { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; font-size: 14px; font-weight: 700; flex: none; color: var(--accent); box-shadow: inset 0 0 0 1.5px rgba(221,167,120,0.5); }
.step.done .n { background: var(--accent-fill); color: var(--on-accent); box-shadow: none; }
.step.done .title { color: var(--fg-2); text-decoration: line-through; text-decoration-color: var(--fg-3); }
.step .btn { flex: none; min-height: 34px; padding: 0 14px; font-size: 11px; }
.guide { display: flex; flex-direction: column; gap: 10px; }
.guide .g { display: flex; gap: 14px; align-items: flex-start; padding: 14px 16px; background: var(--surface); border-radius: var(--r); box-shadow: inset 0 0 0 1px var(--line); }
.guide .g svg.i { color: var(--accent); margin-top: 1px; }
.guide b { display: block; font-size: 16px; margin-bottom: 3px; }
.guide span { font-size: 15px; color: var(--fg-2); }
.cancelled-note { display: flex; gap: 10px; align-items: center; justify-content: space-between; background: var(--surface); box-shadow: inset 0 0 0 1px var(--line); border-radius: 16px; padding: 12px 14px 12px 16px; font-size: 15px; color: var(--fg-2); }
.cancelled-note .btn { flex: none; min-height: 36px; padding: 0 14px; font-size: 11px; }
.ws-day.mixed .dn, .mg-day.mixed .dn { box-shadow: inset 0 0 0 1.5px var(--warn); }
.week-head .mixed .load { color: var(--warn); }
.alert-box p { white-space: pre-line; }

/* ---------- Campuses ---------- */
.campus-tag { display: inline-flex; align-items: center; gap: 7px; font-size: 11px; font-weight: 600; letter-spacing: 0.16em; text-transform: uppercase; color: var(--fg); white-space: nowrap; }
.campus-tag::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--cc); flex: none; }
.campus-tag small { font-size: 11px; font-weight: 500; letter-spacing: 0.02em; text-transform: none; color: var(--fg-2); }
.campus-legend { display: flex; gap: 8px 18px; flex-wrap: wrap; padding: 0 20px 14px; }
.cb { width: 16px; height: 2px; border-radius: 1px; background: var(--cc, transparent); }
.tl-col.campus { background: color-mix(in srgb, var(--cc) 6%, transparent); }
.mg-day.campus { background: color-mix(in srgb, var(--cc) 8%, transparent); }
.campus-dot { width: 12px; height: 12px; border-radius: 50%; background: var(--cc); flex: none; }
.days-pick { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; }
.days-pick button { min-height: 46px; border-radius: 12px; background: rgba(255,255,255,0.04); box-shadow: inset 0 0 0 1px var(--line); font-size: 13px; font-weight: 600; color: var(--fg-2); text-align: center; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; }
.days-pick button small { font-size: 9px; font-weight: 500; letter-spacing: 0.02em; color: var(--fg-3); max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; padding: 0 2px; }
.days-pick button[aria-pressed="true"] { background: var(--accent-fill); color: var(--on-accent); box-shadow: none; }
.days-pick button[aria-pressed="true"] small { color: var(--on-accent); opacity: .7; }
.campus-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; padding: 0 6px; }

/* ---------- Reschedule ---------- */
.opt { gap: 14px; }
.opt .radio { width: 22px; height: 22px; border-radius: 50%; box-shadow: inset 0 0 0 1.5px var(--fg-3); flex: none; display: grid; place-items: center; }
.opt[aria-pressed="true"] .radio { box-shadow: inset 0 0 0 1.5px var(--accent-solid); }
.opt[aria-pressed="true"] .radio::after { content: ""; width: 12px; height: 12px; border-radius: 50%; background: var(--accent-solid); }
.opt[aria-pressed="true"] .title { color: var(--accent); }
.opt .sub.warn { color: var(--warn); }
.moved { font-size: 12px; color: var(--accent); margin-top: 2px; }
.move-card .row { min-height: 50px; }
.move-card .k { width: 46px; flex: none; font-size: 10px; font-weight: 600; letter-spacing: 0.18em; text-transform: uppercase; color: var(--fg-2); }
.move-card .was { color: var(--fg-2); text-decoration: line-through; text-decoration-color: var(--fg-3); }
.move-card .now { color: var(--accent); }
.lesson-head { display: flex; align-items: center; gap: 12px; padding: 0 4px; }
.lesson-head .title { font-size: 17px; }
.lesson-head .sub { font-size: 14px; color: var(--fg-2); }

/* ---------- Students ---------- */
.search { display: flex; align-items: center; gap: 8px; background: rgba(255,255,255,0.04); box-shadow: inset 0 0 0 1px var(--line); border-radius: 99px; padding: 0 16px; height: 44px; margin: 0 16px 16px; }
.search svg.i { width: 18px; height: 18px; color: var(--accent); }
.search input { flex: 1; border: 0; background: none; outline: none; font-size: 16px; min-width: 0; }
.search input::placeholder { color: var(--fg-3); }
.student-row { --inset: 70px; }
.due { color: var(--warn); }

.profile { display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center; padding: 10px 16px 0; }
.profile h1 { margin: 16px 0 0; font-family: var(--font-display); font-weight: 400; font-size: 26px; letter-spacing: 0.16em; text-transform: uppercase; text-wrap: balance; line-height: 1.2; }
.profile p { margin: 0; color: var(--accent); font-size: 12px; letter-spacing: 0.26em; text-transform: uppercase; }
.quick { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; width: 100%; margin-top: 20px; }
.quick a, .quick button { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 12px 4px 11px; background: rgba(255,255,255,0.035); box-shadow: inset 0 0 0 1px var(--line); border-radius: 18px; color: var(--accent); font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; text-decoration: none; text-align: center; }
.quick a:active, .quick button:active { background: var(--surface-2); }
.quick .disabled { color: var(--fg-3); pointer-events: none; }
.notes-card { background: var(--surface); box-shadow: inset 0 0 0 1px var(--line); border-radius: var(--r); padding: 16px 18px; font-size: 15px; white-space: pre-wrap; overflow-wrap: anywhere; color: var(--fg); }
.note-line { font-size: 13px; color: var(--fg-2); white-space: normal; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; margin-top: 2px; }
.hist-month { font-family: var(--font-display); font-size: 12px; color: var(--accent); text-transform: uppercase; letter-spacing: 0.22em; padding: 8px 6px 2px; }

/* ---------- Hours ---------- */
.big-stat { display: flex; flex-direction: column; align-items: center; gap: 2px; }
.big-stat .v { font-family: var(--font-display); font-size: 64px; font-weight: 200; letter-spacing: -0.03em; font-variant-numeric: tabular-nums; line-height: 1; }
.big-stat .u { font-size: 11px; font-weight: 600; letter-spacing: 0.3em; text-transform: uppercase; color: var(--accent); }
.summary {
  border-radius: 28px; padding: 26px 20px 22px; display: flex; flex-direction: column; align-items: center; gap: 18px; text-align: center;
  background: var(--panel-strong); box-shadow: inset 0 0 0 1px rgba(232, 214, 190, 0.08);
}
.summary .facts { display: flex; gap: 8px 20px; flex-wrap: wrap; justify-content: center; font-size: 14px; color: var(--fg-2); }
.summary .facts b { color: var(--fg); font-weight: 600; font-variant-numeric: tabular-nums; }
.hbar { height: 4px; border-radius: 2px; background: rgba(255,255,255,0.06); overflow: hidden; margin-top: 8px; }
.hbar i { display: block; height: 100%; background: var(--c); border-radius: 2px; }
.hours-row { --inset: 70px; align-items: center; }

<script>
(() => {
'use strict';

/* =========================================================
   Utilities
   ========================================================= */
const EMBED = !!window.CADENCE_EMBED;
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const uid = () => Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-5);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const pad = n => String(n).padStart(2, '0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const hm = d => `${pad(d.getHours())}:${pad(d.getMinutes())}`;
const parseDate = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const parseDT = s => { const [ds, ts = '00:00'] = s.split('T'); const d = parseDate(ds); const [h, mi] = ts.split(':').map(Number); d.setHours(h, mi, 0, 0); return d; };
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
const startOfDay = d => { const x = new Date(d); x.setHours(0, 0, 0, 0); return x; };
const startOfWeek = d => { const x = startOfDay(d); return addDays(x, -((x.getDay() + 6) % 7)); };
const sameDay = (a, b) => a.getFullYear() === b.getFullYear() && a.getMonth() === b.getMonth() && a.getDate() === b.getDate();
const dayDiff = (a, b) => Math.round((startOfDay(a) - startOfDay(b)) / 864e5);
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));

const F = (o) => new Intl.DateTimeFormat(undefined, o);
const fTime = F({ hour: 'numeric', minute: '2-digit' });
const fDayLong = F({ weekday: 'long', day: 'numeric', month: 'long' });
const fDayShort = F({ weekday: 'short', day: 'numeric', month: 'short' });
const fWd = F({ weekday: 'short' });
const fWdLong = F({ weekday: 'long' });
const fMonthYear = F({ month: 'long', year: 'numeric' });
const fMonth = F({ month: 'long' });
const fDM = F({ day: 'numeric', month: 'short' });
const fDMY = F({ day: 'numeric', month: 'short', year: 'numeric' });
const fNum = new Intl.NumberFormat(undefined, { maximumFractionDigits: 2 });
const fNum1 = new Intl.NumberFormat(undefined, { maximumFractionDigits: 1 });
const fHour = h => { const d = new Date(2000, 0, 1, h); return F({ hour: 'numeric' }).format(d); };

const time = d => fTime.format(d);
const hrs = min => fNum.format(min / 60);
const dur = m => m < 60 ? `${m} min` : (m % 60 ? `${Math.floor(m / 60)} h ${m % 60} min` : `${m / 60} h`);
const money = v => `${db.settings.currency}${new Intl.NumberFormat(undefined, { minimumFractionDigits: v % 1 ? 2 : 0, maximumFractionDigits: 2 }).format(v)}`;
const plural = (n, one, many = one + 's') => `${n} ${n === 1 ? one : many}`;
const initials = name => (name || '?').trim().split(/\s+/).slice(0, 2).map(p => p[0]).join('').toUpperCase();
const firstName = name => (name || '').trim().split(/\s+/)[0] || '';

function relPast(d, now = new Date()) {
  const n = dayDiff(now, d);
  if (n <= 0) return 'Today';
  if (n === 1) return 'Yesterday';
  if (n < 7) return `${n} days ago`;
  if (n < 35) { const w = Math.round(n / 7); return w === 1 ? 'A week ago' : `${w} weeks ago`; }
  return (d.getFullYear() === now.getFullYear() ? fDM : fDMY).format(d);
}
function relFuture(d, now = new Date()) {
  const n = dayDiff(d, now);
  if (n === 0) {
    const mins = Math.round((d - now) / 60000);
    if (mins <= 0) return 'Now';
    if (mins < 60) return `In ${mins} min`;
    const h = Math.floor(mins / 60), m = mins % 60;
    return m ? `In ${h} h ${m} min` : `In ${h} h`;
  }
  if (n === 1) return `Tomorrow, ${time(d)}`;
  if (n < 7) return `${fWdLong.format(d)}, ${time(d)}`;
  return `${fDayShort.format(d)}, ${time(d)}`;
}

const COLORS = ['#5856D6', '#007AFF', '#32ADE6', '#30B0A0', '#34A853', '#FF9500', '#FF3B30', '#FF2D55', '#AF52DE', '#A2845E'];
const INSTRUMENTS = ['Piano', 'Voice', 'Violin', 'Viola', 'Cello', 'Double Bass', 'Guitar', 'Bass Guitar', 'Flute', 'Clarinet', 'Saxophone', 'Trumpet', 'Trombone', 'French Horn', 'Drums', 'Percussion', 'Organ', 'Harp', 'Composition', 'Music Theory', 'Aural Skills', 'Conducting'];

const ICON = {
  today: '<circle cx="12" cy="12" r="4.2"/><path d="M12 2.6v2.1M12 19.3v2.1M4.7 4.7l1.5 1.5M17.8 17.8l1.5 1.5M2.6 12h2.1M19.3 12h2.1M4.7 19.3l1.5-1.5M17.8 6.2l1.5-1.5"/>',
  calendar: '<rect x="3.5" y="5" width="17" height="15.5" rx="3.2"/><path d="M3.5 10h17M8 3v4M16 3v4"/><circle cx="8.5" cy="14.5" r=".6" fill="currentColor"/><circle cx="12" cy="14.5" r=".6" fill="currentColor"/><circle cx="15.5" cy="14.5" r=".6" fill="currentColor"/>',

  mail: '<rect x="3.5" y="5.5" width="17" height="13" rx="2.5"/><path d="m4.5 7 7.5 6 7.5-6"/>',
  search: '<circle cx="10.8" cy="10.8" r="6.3"/><path d="m15.5 15.5 4.5 4.5"/>',

  note: '<path d="M14.5 4.5l5 5L9 20H4v-5Z"/><path d="m12.5 6.5 5 5"/>',
  music: '<path d="M9 18V5.5l11-2.2V16"/><circle cx="6.5" cy="18" r="2.5"/><circle cx="17.5" cy="16" r="2.5"/>',
  repeat: '<path d="M4 11V9a3 3 0 0 1 3-3h12l-3-3M20 13v2a3 3 0 0 1-3 3H5l3 3"/>',
  chart: '<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>',
  lock: '<rect x="5" y="10.5" width="14" height="10" rx="2.5"/><path d="M8 10.5V7.5a4 4 0 0 1 8 0v3"/>',
  share: '<path d="M12 15V3.5M8 7.2l4-3.7 4 3.7"/><path d="M8.5 10.5H7a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-6a2 2 0 0 0-2-2h-1.5"/>',
  move: '<rect x="3.5" y="5" width="17" height="15.5" rx="3.2"/><path d="M3.5 10h17M8 3v4M16 3v4"/><path d="M8.5 15.2h7M13.3 13l2.2 2.2-2.2 2.2"/>',
  alert: '<path d="M12 4 2.8 19.5h18.4Z"/><path d="M12 10v4.2"/><circle cx="12" cy="17" r=".6" fill="currentColor"/>',
};
const icon = (n, cls = 'i') => `<svg class="${cls}" viewBox="0 0 24 24" aria-hidden="true">${ICON[n]}</svg>`;
const APP_MARK = `<svg class="mark" viewBox="0 0 512 512" aria-hidden="true"><defs><linearGradient id="mk" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#14473A"/><stop offset="1" stop-color="#14473A"/></linearGradient><linearGradient id="mc" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#D29D70"/><stop offset="1" stop-color="#D29D70"/></linearGradient></defs><rect width="512" height="512" rx="114" fill="url(#mk)"/><g fill="url(#mc)"><rect x="96" y="104" width="320" height="16" rx="8" opacity=".22"/><rect x="96" y="160" width="320" height="16" rx="8" opacity=".22"/><rect x="96" y="216" width="320" height="16" rx="8" opacity=".22"/><rect x="96" y="272" width="320" height="16" rx="8" opacity=".22"/><rect x="96" y="328" width="320" height="16" rx="8" opacity=".22"/><ellipse cx="190" cy="372" rx="54" ry="40" transform="rotate(-22 190 372)"/><ellipse cx="350" cy="336" rx="54" ry="40" transform="rotate(-22 350 336)"/><rect x="226" y="140" width="22" height="236" rx="6"/><rect x="386" y="104" width="22" height="236" rx="6"/><path d="M226 140 408 104v58l-182 36Z"/></g></svg>`;

/* =========================================================
   Data
   ========================================================= */
const KEY = 'cadence.v1';
const HORIZON_WEEKS = 16;
const blank = () => ({
  version: 1,
  students: [], lessons: [], series: [],
  settings: { termStart: '', termEnd: '', currency: '€', country: '353', dayStart: 8, dayEnd: 21, staleDays: 14, defaultDuration: 60, campuses: [] },
  meta: { started: false, sample: false, lastBackup: null, installDismissed: false, campusDismissed: false },
});
function normalize(d) {
  const b = blank();
  return {
    ...b, ...d,
    students: Array.isArray(d.students) ? d.students : [],
    lessons: Array.isArray(d.lessons) ? d.lessons : [],
    series: Array.isArray(d.series) ? d.series : [],
    settings: { ...b.settings, ...(d.settings || {}) },
    meta: { ...b.meta, ...(d.meta || {}) },

}
function load() {
  try { const raw = localStorage.getItem(KEY); if (raw) return normalize(JSON.parse(raw)); } catch (e) { /* storage unavailable */ }
  return blank();
}
let saveWarned = false;
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(db)); }
  catch (e) { if (!saveWarned && !EMBED) { saveWarned = true; toast('Changes could not be saved on this device'); } }
}
let db = load();

const stu = id => db.students.find(s => s.id === id);
const lessonEnd = l => new Date(parseDT(l.start).getTime() + l.duration * 60000);
function stateOf(l, now = new Date()) {
  if (l.status === 'cancelled') return 'cancelled';

const isOff = st => st === 'cancelled' || st === 'missed';
const sortLessons = arr => arr.sort((a, b) => a.start < b.start ? -1 : a.start > b.start ? 1 : 0);
function lessonsBetween(from, to) {
  const a = ymd(from) + 'T00:00', b = ymd(to) + 'T00:00';
  return sortLessons(db.lessons.filter(l => l.start >= a && l.start < b));
}
function indexByStudent() {
  const m = new Map();
  for (const l of db.lessons) { if (!m.has(l.studentId)) m.set(l.studentId, []); m.get(l.studentId).push(l); }
  for (const a of m.values()) sortLessons(a);
  return m;
}
function statsFor(list, now = new Date()) {
  let last = null, next = null, taughtMin = 0, taught = 0;
  for (const l of list || []) {
    const st = stateOf(l, now);
    if (st === 'taught') { taught++; taughtMin += l.duration; last = l; }
    else if ((st === 'upcoming' || st === 'live') && !next) next = l;

}
function termRange() {
  const s = db.settings;

  const to = s.termEnd ? addDays(parseDate(s.termEnd), 1) : addDays(startOfDay(new Date()), 3650);

}
function minutesIn(list, from, to, states = ['taught']) {

  let m = 0; for (const l of list || []) if (l.start >= a && l.start < b && states.includes(stateOf(l))) m += l.duration;

/* Weekly lessons are stored as a series and materialised as real lessons
   up to HORIZON_WEEKS ahead, so every lesson can carry its own notes and status. */
function extendSeries() {
  const horizon = addDays(startOfDay(new Date()), HORIZON_WEEKS * 7);

  for (const s of db.series) {
    const from = s.generatedUntil ? addDays(parseDate(s.generatedUntil), 1) : parseDate(s.startDate);
    let end = horizon;
    if (s.until) { const u = parseDate(s.until); if (u < end) end = u; }
    if (end < from) continue;
    let d = new Date(from);
    while (d.getDay() !== s.weekday) d = addDays(d, 1);
    for (; d <= end; d = addDays(d, 7)) {
      db.lessons.push({ id: uid(), studentId: s.studentId, start: `${ymd(d)}T${s.time}`, duration: s.duration, status: 'scheduled', notes: '', seriesId: s.id });
      changed = true;
    }

}
function addSeries(studentId, startDate, timeStr, duration) {
  const sd = parseDate(startDate);

}
/* Ends a weekly series: removes its future, untouched lessons. Past lessons stay in the history. */
function endSeries(seriesId) {

  db.series = db.series.filter(s => s.id !== seriesId);
}

    const c = addDays(d, i);
    if (c.getDay() === weekday) {
      const [h, m] = timeStr.split(':').map(Number); const dt = new Date(c); dt.setHours(h, m);
      if (dt > now) return ymd(c);

}
function clashes(start, duration, ignoreId) {
  const s = parseDT(start).getTime(), e = s + duration * 60000;
  return db.lessons.filter(l => l.id !== ignoreId && !isOff(stateOf(l)) && (() => {
    const ls = parseDT(l.start).getTime(), le = ls + l.duration * 60000; return ls < e && s < le;
  })());
}
function seriesLabel(s) {
  const d = parseDate(s.startDate);
  const t = new Date(2000, 0, 1, ...s.time.split(':').map(Number));
  return { day: fWdLong.format(d) + 's', when: `${time(t)} · ${dur(s.duration)}` };
}

/* Campuses: each weekday belongs to at most one campus, and each student to one campus.
   He travels between them, so a day is spent at one campus only. */
const CAMPUS_COLORS = ['#D29D70', '#7FB8A4', '#A9A4DB', '#D9C27A'];
const WEEK = [1, 2, 3, 4, 5, 6, 0];
const campuses = () => db.settings.campuses || [];
const campusById = id => campuses().find(c => c.id === id) || null;
const campusOfDay = d => campuses().find(c => (c.days || []).includes(d.getDay())) || null;
const campusOfStudent = s => (s ? campusById(s.campusId) : null);
const campusDays = c => (c && c.days && c.days.length ? c.days : null);
const dayName = w => fWdLong.format(addDays(startOfWeek(new Date()), (w + 6) % 7));
const campusDaysText = c => WEEK.filter(w => (c.days || []).includes(w)).map(w => dayName(w).slice(0, 3)).join(', ');
const campusTag = (c, extra = '') => `<span class="campus-tag" style="--cc:${c.color}">${esc(c.name)}${extra ? ` <small>${esc(extra)}</small>` : ''}</span>`;
/* Days a student can be booked on: their campus's days, or any day when no campus is set. */
const studentDays = s => campusDays(campusOfStudent(s)) || WEEK;
function nextCampusDate(s, after) {
  const days = studentDays(s);
  for (let i = 1; i <= 14; i++) { const d = addDays(startOfDay(after), i); if (days.includes(d.getDay())) return d; }
  return null;
}
/* Plain-language campus warnings for booking a student on a given date. */
function campusWarnings(s, dateStr, ignoreId) {
  if (!campuses().length || !s || !dateStr) return [];
  const d = parseDate(dateStr); const dc = campusOfDay(d); const sc = campusOfStudent(s);
  if (!sc) return [];
  if (dc && dc.id !== sc.id) return [`${fWdLong.format(d)} is a ${dc.name} day. ${firstName(s.name)} is at ${sc.name}.`];
  const other = lessonsBetween(d, addDays(d, 1)).filter(x => x.id !== ignoreId && !isOff(stateOf(x)) && (() => { const c2 = campusOfStudent(stu(x.studentId)); return c2 && c2.id !== sc.id; })());
  if (other.length) return [`You're teaching at ${campusOfStudent(stu(other[0].studentId)).name} that day (${plural(other.length, 'lesson')}).`];
  if (!dc && campusDays(sc)) return [`${fWdLong.format(d)} isn't one of your ${sc.name} days (${campusDaysText(sc)}).`];

}
/* Places students by their weekly lessons: anyone without a campus, or whose weekly days no longer
   belong to their campus, moves to the campus those days belong to, when that's unambiguous. */
function autoAssignCampuses() {
  let n = 0;
  for (const s of db.students) {
    const days = db.series.filter(x => x.studentId === s.id).map(x => x.weekday);
    const cur = campusById(s.campusId);
    if (cur && (!days.length || days.some(w => (cur.days || []).includes(w)))) continue;
    const ids = new Set(days.map(w => campuses().find(c => (c.days || []).includes(w))?.id).filter(Boolean));
    if (ids.size === 1 && s.campusId !== [...ids][0]) { s.campusId = [...ids][0]; n++; }
  }
  return n;
}
/* What a booking would get wrong: a double booking, or a day split across two campuses. */
function bookingProblems(s, start, duration, ignoreId) {
  const out = [];
  const c = clashes(start, duration, ignoreId);
  if (c.length) out.push({ kind: 'clash', text: c[0].studentId === s?.id ? `${firstName(s.name)} already has a lesson at ${time(parseDT(c[0].start))} that day.` : `It overlaps ${stu(c[0].studentId)?.name || 'another lesson'} (${time(parseDT(c[0].start))}–${time(lessonEnd(c[0]))}).` });
  for (const w of campusWarnings(s, start.slice(0, 10), ignoreId)) out.push({ kind: 'campus', text: w });
  return out;
}
/* Stops a save to ask first. Returns true when there's nothing to ask, or he has already said go ahead. */
function confirmProblems(problems, okLabel) {
  const root = $('#sheet-root');
  if (!problems.length || root.dataset.confirmed === '1') return true;
  const campus = problems.some(x => x.kind === 'campus');
  ask({
    title: campus ? 'Two campuses that day' : 'Double booking',
    message: problems.map(x => x.text).join('\n\n') + '\n\nDo you want to go ahead?',
    actions: [{ label: okLabel, value: true, style: 'strong' }, { label: 'Go back', value: false }],
  }).then(ok => { if (ok) { root.dataset.confirmed = '1'; trySave(); delete root.dataset.confirmed; } });

}
/* Campuses with lessons on a given day; more than one means he'd have to travel. */
function campusesOn(d) {
  const ids = new Set(lessonsBetween(d, addDays(d, 1)).filter(l => !isOff(stateOf(l))).map(l => campusOfStudent(stu(l.studentId))?.id).filter(Boolean));
  return [...ids].map(campusById);
}
const warnBox = (title, text) => `<div class="warning">${icon('alert')}<div><b>${esc(title)}</b>${text ? `<br>${esc(text)}` : ''}</div></div>`;

/* Anonymous usage counts (GoatCounter), so Callum can see the app is being used.
   Only that something happened, e.g. "lesson booked". Never names, phone numbers or notes, and no cookies.
   Off for sample data, in previews, when switched off in Settings, and on any phone that has opened
   the app once with #nocount on the end of the link. */
const GOAT = 'callumhr1';
const NOCOUNT = (() => {
  try {
    if (location.hash === '#nocount') localStorage.setItem('cadence.nocount', '1');
    if (location.hash === '#count') localStorage.removeItem('cadence.nocount');
    return localStorage.getItem('cadence.nocount') === '1';
  } catch (e) { return false; }
})();
function track(name, pageview = false) {
  if (EMBED || NOCOUNT || !GOAT || db.meta.sample || db.meta.analyticsOff || location.protocol !== 'https:') return;
  try {
    const q = new URLSearchParams({ p: pageview ? '/' + name : name, t: name, e: pageview ? 'false' : 'true', s: `${screen.width},${screen.height},${devicePixelRatio || 1}`, rnd: Math.random().toString(36).slice(2) });
    const url = `https://${GOAT}.goatcounter.com/count?${q}`;
    if (!(navigator.sendBeacon && navigator.sendBeacon(url))) new Image().src = url;
  } catch (e) { /* counting must never get in the way */ }
}
let lastOpenCount = 0;
function trackOpen() { if (Date.now() - lastOpenCount > 30 * 60000) { lastOpenCount = Date.now(); track(db.meta.started ? 'app-opened' : 'welcome-screen', true); } }

/* Phone numbers become WhatsApp links. Local numbers (leading 0) take the country code from Settings. */
function waNumber(p) {
  if (!p) return '';

  if (t.startsWith('+')) return t.slice(1);
  if (t.startsWith('00')) return t.slice(2);

}
const waLink = (s, text = '') => { const n = waNumber(s?.phone); return n ? `https://wa.me/${n}${text ? '?text=' + encodeURIComponent(text) : ''}` : ''; };

  const when = n === 0 ? `today at ${time(d)}` : n === 1 ? `tomorrow at ${time(d)}` : `on ${fDayLong.format(d)} at ${time(d)}`;

    const s = stu(next.studentId); const d = parseDT(next.start); const e = lessonEnd(next); const live = stateOf(next, now) === 'live';
    const pct = live ? clamp((now - d) / (e - d) * 100, 0, 100) : 0;
    const wa = waLink(s, live ? '' : reminderText(next));

      <button class="hero-who" data-act="edit-lesson" data-id="${next.id}" aria-label="Open lesson details">${avatar(s)}<div style="min-width:0"><div class="hero-name">${esc(s.name)}</div><div class="hero-meta num">${esc([s.instrument, `${time(d)}–${time(e)}`].filter(Boolean).join(' · '))}</div>${next.movedFrom ? `<div class="moved">Moved from ${esc(movedLabel(next))}</div>` : ''}</div></button>
      ${live ? `<div class="progress" role="progressbar" aria-valuenow="${Math.round(pct)}" aria-valuemin="0" aria-valuemax="100"><i style="width:${pct}%"></i></div>` : ''}

        ${live ? `<button class="btn tint" data-act="edit-lesson" data-id="${next.id}">${icon('note')}Lesson notes</button>` : `<button class="btn tint" data-act="reschedule" data-id="${next.id}">${icon('move')}Reschedule</button>`}
      </div>
    </section>`;
  } else if (!db.students.length && db.meta.campusDismissed) {
    html += `<section class="hero"><div class="hero-top"><span class="hero-label">Get started</span></div><div class="hero-name">Add your students</div><div class="hero-meta">Add each student with their weekly lesson time and your calendar fills itself.</div><div class="hero-actions"><button class="btn fill" data-act="new-student">${icon('plus')}Add a student</button></div></section>`;
  } else if (db.students.length) {

  }

  html += `<div class="tiles">
    <div class="tile"><span class="k">Today</span><span class="v">${todayOn.length}</span><span class="s">${todayOn.length === 1 ? 'lesson' : 'lessons'} · ${hrs(todayOn.reduce((a, l) => a + l.duration, 0))} h</span></div>
    <div class="tile"><span class="k">This week</span><span class="v">${hrs(weekMin)}<small>h</small></span><span class="s">${hrs(weekDone)} h done</span></div>
    <div class="tile"><span class="k">${term ? 'This term' : fMonth.format(now)}</span><span class="v">${hrs(termMin)}<small>h</small></span><span class="s">${term ? 'since ' + fDM.format(term.from) : 'taught'}</span></div>
  </div>`;

  html += `<section class="section"><div class="section-h"><h2>Schedule</h2>${cToday ? campusTag(cToday) : `<button class="link" data-act="goto-cal">Calendar</button>`}</div>
    ${campusesOn(today).length > 1 ? warnBox('Two campuses today', `You have lessons at ${campusesOn(today).map(c => c.name).join(' and ')}. Move one so you're not travelling between them.`) : ''}
    <div class="group">${todays.length ? todays.map(l => lessonRow(l)).join('') : `<div class="empty">No lessons today.</div>`}</div></section>`;

  // Tomorrow preview keeps the evening-before check quick.
  const tmr = lessonsBetween(addDays(today, 1), addDays(today, 2));
  const cTmr = campusOfDay(addDays(today, 1));
  if (tmr.length) html += `<section class="section"><div class="section-h"><h2>Tomorrow</h2>${cTmr ? campusTag(cTmr) : `<span class="meta">${plural(tmr.length, 'lesson')}</span>`}</div>${campusesOn(addDays(today, 1)).length > 1 ? warnBox('Two campuses tomorrow', `Lessons at ${campusesOn(addDays(today, 1)).map(c => c.name).join(' and ')}.`) : ''}<div class="group">${tmr.map(l => lessonRow(l)).join('')}</div></section>`;

  // Students drifting away: nothing booked soon and not seen for a while.
  const idx = indexByStudent();
  const stale = db.students.filter(s => !s.archived).map(s => {
    const st = statsFor(idx.get(s.id), now);
    const soon = st.next && dayDiff(parseDT(st.next.start), now) <= 14;
    const gap = st.last ? dayDiff(now, parseDT(st.last.start)) : Infinity;
    return { s, st, soon, gap };
  }).filter(x => !x.soon && x.gap >= db.settings.staleDays).sort((a, b) => b.gap - a.gap);
  if (stale.length) {
    html += `<section class="section"><div class="section-h"><h2>Not seen lately</h2><span class="meta">Nothing booked</span></div><div class="group">${stale.slice(0, 5).map(({ s, st }) => `

  }

  // Recent lessons without notes.
  const week = addDays(today, -7);
  const un = db.lessons.filter(l => !l.notes && stateOf(l, now) === 'taught' && parseDT(l.start) >= week && stu(l.studentId)).sort((a, b) => a.start < b.start ? 1 : -1).slice(0, 4);
  if (un.length) {
    html += `<section class="section"><div class="section-h"><h2>Add lesson notes</h2><span class="meta">${plural(un.length, 'lesson')}</span></div><div class="group">${un.map(l => { const s = stu(l.studentId); const d = parseDT(l.start); return `
      <button class="row student-row" data-act="edit-lesson" data-id="${l.id}" data-focus="notes">${avatar(s)}<div class="grow"><div class="title">${esc(s.name)}</div><div class="sub">${esc(relPast(d, now))}, ${time(d)} · What did you cover?</div></div>${icon('note', 'i chev')}</button>`; }).join('')}</div></section>`;
  }

  return html + '</main>';
}

function weekStrip(sel, now) {
  const w = startOfWeek(sel);
  return `<div class="weekstrip">${Array.from({ length: 7 }, (_, i) => {
    const d = addDays(w, i); const ls = lessonsBetween(d, addDays(d, 1)).filter(l => !isOff(stateOf(l)));

  }).join('')}</div>`;
}
function weekHead(w, now) {
  return `<div class="week-head"><span></span>${Array.from({ length: 7 }, (_, i) => {
    const d = addDays(w, i); const m = lessonsBetween(d, addDays(d, 1)).filter(l => !isOff(stateOf(l))).reduce((a, l) => a + l.duration, 0);
    const mixed = campusesOn(d).length > 1;
    return `<button class="${sameDay(d, now) ? 'today' : ''}${mixed ? ' mixed' : ''}" data-act="cal-pick" data-date="${ymd(d)}"><span class="dw">${esc(fWd.format(d).slice(0, 1))}</span><span class="dn">${d.getDate()}</span><span class="cb" style="--cc:${campusOfDay(d)?.color || 'transparent'}"></span><span class="load">${mixed ? '2 sites' : m ? hrs(m) + 'h' : '&nbsp;'}</span></button>`;
  }).join('')}</div>`;
}
/* Lays overlapping lessons side by side within a day column. */
function layoutDay(ls) {
  const items = ls.map(l => ({ l, s: parseDT(l.start).getTime(), e: lessonEnd(l).getTime(), col: 0, cols: 1 }));
  let cluster = [], clusterEnd = 0;
  const flush = () => { const n = Math.max(1, ...cluster.map(x => x.col + 1)); cluster.forEach(x => x.cols = n); cluster = []; };
  for (const it of items) {
    if (cluster.length && it.s >= clusterEnd) flush();
    const used = new Set(cluster.filter(x => x.e > it.s).map(x => x.col));
    let c = 0; while (used.has(c)) c++;
    it.col = c; cluster.push(it); clusterEnd = Math.max(clusterEnd, it.e);
  }
  flush();
  return items;
}
function timeline(days, now, hourH, compact = false) {
  let start = db.settings.dayStart, end = db.settings.dayEnd;
  const all = days.map(d => lessonsBetween(d, addDays(d, 1)));
  for (const ls of all) for (const l of ls) {
    const s = parseDT(l.start); const e = lessonEnd(l);
    start = Math.min(start, s.getHours());
    end = Math.max(end, e.getHours() + (e.getMinutes() ? 1 : 0));
  }
  if (days.some(d => sameDay(d, now))) { start = Math.min(start, now.getHours()); end = Math.max(end, now.getHours() + 1); }
  end = Math.min(24, Math.max(end, start + 1));
  const H = (end - start) * hourH;
  let hours = '';
  for (let h = start; h <= end; h++) hours += `<div class="tl-hour${h === start ? ' first' : ''}" style="top:${(h - start) * hourH}px">${h < end ? `<span>${esc(fHour(h))}</span>` : ''}</div>`;
  const cols = days.map((d, i) => {
    const evs = layoutDay(all[i]).map(({ l, col, cols }) => {
      const s = stu(l.studentId); const sd = parseDT(l.start); const st = stateOf(l, now);
      const top = ((sd.getHours() - start) * 60 + sd.getMinutes()) / 60 * hourH;
      const h = Math.max(compact ? 20 : 24, l.duration / 60 * hourH - 2);
      const w = 100 / cols;
      const name = compact ? firstName(s?.name) : (s?.name || 'Former student');
      const meta = compact ? time(sd) : `${time(sd)} · ${dur(l.duration)}${s?.instrument ? ' · ' + s.instrument : ''}`;
      return `<button class="ev${isOff(st) ? ' off' : ''}${st === 'taught' && !compact ? ' done' : ''}" data-act="edit-lesson" data-id="${l.id}" style="--c:${s?.color || COLORS[0]};top:${top + 1}px;height:${h}px;left:calc(${col * w}% + 2px);right:auto;width:calc(${w}% - 4px)" aria-label="${esc((s?.name || '') + ', ' + time(sd))}"><span class="t">${esc(name)}</span>${h > 30 ? `<span class="m">${esc(meta)}</span>` : ''}</button>`;
    }).join('');
    let nowLine = '';
    if (sameDay(d, now)) { const y = ((now.getHours() - start) * 60 + now.getMinutes()) / 60 * hourH; nowLine = `<div class="now-line" style="top:${y}px"></div>`; }
    const dc = campusOfDay(d);
    return `<div class="tl-col${dc ? ' campus' : ''}${days.length > 1 && sameDay(d, now) ? ' today-col' : ''}" ${dc ? `style="--cc:${dc.color}"` : ''} data-act="cal-slot" data-date="${ymd(d)}" data-start="${start}" data-hh="${hourH}">${evs}${nowLine}</div>`;
  }).join('');
  let tag = '';
  if (!compact && days.some(d => sameDay(d, now))) { const y = ((now.getHours() - start) * 60 + now.getMinutes()) / 60 * hourH; tag = `<span class="now-tag" style="top:${y}px">${esc(time(now))}</span>`; }
  return `<div class="timeline-wrap${compact ? ' week' : ''}"><div class="timeline" style="height:${H}px"><div class="tl-hours">${hours}</div><div class="tl-cols">${cols}</div>${tag}</div></div>`;
}
function monthGrid(sel, now) {
  const first = new Date(sel.getFullYear(), sel.getMonth(), 1);
  const gs = startOfWeek(first);
  const last = new Date(sel.getFullYear(), sel.getMonth() + 1, 0);
  const weeks = Math.ceil((dayDiff(last, gs) + 1) / 7);
  const ls = lessonsBetween(gs, addDays(gs, weeks * 7)).filter(l => !isOff(stateOf(l)));
  const byDay = new Map(); for (const l of ls) { const k = l.start.slice(0, 10); if (!byDay.has(k)) byDay.set(k, []); byDay.get(k).push(l); }
  let html = `<div class="month"><div class="month-grid">`;
  for (let i = 0; i < 7; i++) html += `<div class="mg-dow">${esc(fWd.format(addDays(gs, i)).slice(0, 1))}</div>`;
  for (let i = 0; i < weeks * 7; i++) {
    const d = addDays(gs, i); const day = byDay.get(ymd(d)) || [];
    const dc = campusOfDay(d);
    html += `<button ${dc ? `style="--cc:${dc.color}"` : ''} class="mg-day${dc ? ' campus' : ''}${campusesOn(d).length > 1 ? ' mixed' : ''}${d.getMonth() !== sel.getMonth() ? ' other' : ''}${sameDay(d, now) ? ' today' : ''}${sameDay(d, sel) ? ' sel' : ''}" data-act="cal-pick" data-date="${ymd(d)}" data-stay="1" aria-label="${esc(fDayLong.format(d))}${day.length ? ', ' + plural(day.length, 'lesson') : ''}"><span class="dn">${d.getDate()}</span><span class="mg-dots">${day.slice(0, 6).map(l => `<i style="--c:${stu(l.studentId)?.color || COLORS[0]}"></i>`).join('')}</span>${day.length > 6 ? `<span class="mg-count">+${day.length - 6}</span>` : ''}</button>`;
  }
  return html + `</div></div>`;
}
