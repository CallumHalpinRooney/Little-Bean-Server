<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cadence Lesson Book</title>
<meta name="description" content="Keep track of every student, lesson and hour you teach.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Cadence">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
/* Layout: one column, iOS-style app shell. Large collapsing titles, inset grouped lists,
   a blurred tab bar fixed to the bottom, sheets that rise from the bottom edge. 640px max. */
:root {
  --bg: #F2F2F7;
  --surface: #FFFFFF;
  --surface-2: #E9E9F0;
  --fill: rgba(118, 118, 128, 0.12);
  --fg: #0B0B12;
  --fg-2: #6B6B78;
  --fg-3: #A3A3AE;
  --sep: rgba(60, 60, 67, 0.16);
  --accent: #4A47D1;
  --accent-fill: #4A47D1;
  --accent-soft: rgba(74, 71, 209, 0.11);
  --on-accent: #FFFFFF;
  --danger: #D92D20;
  --good: #1F8A3B;
  --warn: #B86B00;
  --bar: rgba(247, 247, 250, 0.82);
  --scrim: rgba(10, 10, 20, 0.32);
  --shadow: 0 1px 2px rgba(20, 20, 50, 0.05), 0 10px 30px rgba(20, 20, 50, 0.07);
  --mix: 15%;
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --font-display: -apple-system, BlinkMacSystemFont, "SF Pro Display", system-ui, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --font-round: ui-rounded, "SF Pro Rounded", -apple-system, BlinkMacSystemFont, system-ui, "Segoe UI", Roboto, sans-serif;
  --sat: env(safe-area-inset-top, 0px);
  --sab: env(safe-area-inset-bottom, 0px);
  --r: 14px;
  --ease: cubic-bezier(0.32, 0.72, 0, 1);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #000000; --surface: #1C1C1E; --surface-2: #2C2C2E; --fill: rgba(118, 118, 128, 0.24);
    --fg: #F5F5F7; --fg-2: #9A9AA3; --fg-3: #5D5D65; --sep: rgba(84, 84, 88, 0.55);
    --accent: #8E8CFF; --accent-fill: #5E5CE6; --accent-soft: rgba(142, 140, 255, 0.16); --on-accent: #FFFFFF;
    --danger: #FF5A4F; --good: #34C759; --warn: #FFA826;
    --bar: rgba(22, 22, 24, 0.8); --scrim: rgba(0, 0, 0, 0.55); --shadow: none; --mix: 24%;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #000000; --surface: #1C1C1E; --surface-2: #2C2C2E; --fill: rgba(118, 118, 128, 0.24);
  --fg: #F5F5F7; --fg-2: #9A9AA3; --fg-3: #5D5D65; --sep: rgba(84, 84, 88, 0.55);
  --accent: #8E8CFF; --accent-fill: #5E5CE6; --accent-soft: rgba(142, 140, 255, 0.16); --on-accent: #FFFFFF;
  --danger: #FF5A4F; --good: #34C759; --warn: #FFA826;
  --bar: rgba(22, 22, 24, 0.8); --scrim: rgba(0, 0, 0, 0.55); --shadow: none; --mix: 24%;
  color-scheme: dark;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--fg);
  font-family: var(--font); font-size: 17px; line-height: 1.35; letter-spacing: -0.01em;
  -webkit-font-smoothing: antialiased; overscroll-behavior-y: none;
}
button, input, select, textarea { font: inherit; color: inherit; letter-spacing: inherit; }
button { background: none; border: 0; padding: 0; cursor: pointer; text-align: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 8px; }
svg.i { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.num { font-variant-numeric: tabular-nums; }

#app { max-width: 640px; margin: 0 auto; min-height: 100vh; padding-bottom: calc(96px + var(--sab)); }

/* ---------- Navigation bar + large title ---------- */
.navbar {
  position: sticky; top: 0; z-index: 20;
  padding: var(--sat) 8px 0; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; min-height: calc(44px + var(--sat));
  transition: background-color .2s, box-shadow .2s;
}
.navbar.scrolled { background: var(--bar); -webkit-backdrop-filter: saturate(180%) blur(20px); backdrop-filter: saturate(180%) blur(20px); box-shadow: 0 0.5px 0 var(--sep); }
.nav-title { font-weight: 600; font-size: 17px; opacity: 0; transition: opacity .2s; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 56vw; }
.navbar.scrolled .nav-title, .navbar.pinned .nav-title { opacity: 1; }
.nav-l, .nav-r { display: flex; gap: 2px; align-items: center; }
.nav-r { justify-content: flex-end; }
.nav-btn { color: var(--accent); min-height: 44px; min-width: 44px; padding: 0 8px; display: inline-flex; align-items: center; justify-content: center; gap: 2px; font-size: 17px; border-radius: 10px; }
.nav-btn:active { opacity: .45; }
.nav-btn.strong { font-weight: 600; }
.nav-btn svg.i { width: 26px; height: 26px; }
.nav-btn.back { padding-left: 0; }
.nav-btn.back svg.i { width: 28px; height: 28px; margin-right: -4px; }

.large { padding: 2px 16px 10px; }
.large .eyebrow { margin: 0; font-size: 13px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; color: var(--fg-2); }
.large h1 { margin: 0; font-family: var(--font-display); font-size: 34px; line-height: 1.12; font-weight: 700; letter-spacing: -0.025em; text-wrap: balance; }

main { padding: 0 16px; display: flex; flex-direction: column; gap: 28px; }
.section { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.section-h { display: flex; align-items: baseline; justify-content: space-between; padding: 0 4px; gap: 12px; }
.section-h h2 { margin: 0; font-size: 20px; font-weight: 700; letter-spacing: -0.02em; font-family: var(--font-display); }
.section-h .meta { font-size: 15px; color: var(--fg-2); }
.section-h .link { color: var(--accent); font-size: 15px; }
.footnote { font-size: 13px; color: var(--fg-2); padding: 0 16px; margin: 0; }

/* ---------- Inset grouped list ---------- */
.group { background: var(--surface); border-radius: var(--r); overflow: hidden; }
.row {
  display: flex; align-items: center; gap: 12px; width: 100%; min-height: 50px; padding: 10px 16px;
  position: relative; background: var(--surface);
}
.row + .row::before { content: ""; position: absolute; top: 0; right: 0; left: var(--inset, 16px); height: 0.5px; background: var(--sep); }
button.row:active, a.row:active { background: var(--surface-2); }
a.row { color: inherit; text-decoration: none; }
.row .grow { flex: 1; min-width: 0; }
.row .title { font-size: 17px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row .sub { font-size: 15px; color: var(--fg-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row .trail { color: var(--fg-2); font-size: 15px; display: flex; align-items: center; gap: 4px; flex: none; }
.row .chev { color: var(--fg-3); width: 18px; height: 18px; stroke-width: 2.4; }
.empty { padding: 22px 16px; color: var(--fg-2); font-size: 15px; text-align: center; }

.avatar {
  --c: var(--accent); width: 40px; height: 40px; border-radius: 50%; flex: none;
  display: grid; place-items: center; font-weight: 600; font-size: 15px; letter-spacing: 0;
  color: var(--c); background: color-mix(in srgb, var(--c) var(--mix), var(--surface));
  font-family: var(--font-round);
}
.avatar.lg { width: 84px; height: 84px; font-size: 32px; }

/* Lesson rows */
.lesson-row { --inset: 84px; gap: 10px; }
.lr-time { width: 54px; flex: none; display: flex; flex-direction: column; font-variant-numeric: tabular-nums; }
.lr-time span { font-size: 15px; font-weight: 600; }
.lr-time small { font-size: 13px; color: var(--fg-2); }
.lr-bar { width: 4px; align-self: stretch; border-radius: 2px; background: var(--c); flex: none; }
.lesson-row.off .lr-bar { background: var(--fg-3); }
.lesson-row.off .title { color: var(--fg-2); text-decoration: line-through; text-decoration-color: var(--fg-3); }

.pill { font-size: 12px; font-weight: 600; padding: 3px 8px; border-radius: 99px; white-space: nowrap; flex: none; letter-spacing: 0; }
.pill.taught { color: var(--good); background: color-mix(in srgb, var(--good) 13%, transparent); }
.pill.live { color: var(--on-accent); background: var(--accent-fill); }
.pill.cancelled { color: var(--fg-2); background: var(--fill); }
.pill.missed { color: var(--warn); background: color-mix(in srgb, var(--warn) 14%, transparent); }

/* ---------- Today ---------- */
.hero {
  background: var(--surface); border-radius: 20px; padding: 18px; display: flex; flex-direction: column; gap: 14px;
  box-shadow: var(--shadow); position: relative; overflow: hidden;
}
.hero::after { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 5px; background: var(--c); }
.hero-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.hero-label { font-size: 13px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--fg-2); }
.hero-label.now { color: var(--accent); }
.hero-when { font-size: 15px; color: var(--fg-2); font-variant-numeric: tabular-nums; }
.hero-who { display: flex; align-items: center; gap: 14px; }
.hero-who .avatar { width: 52px; height: 52px; font-size: 19px; }
.hero-name { font-family: var(--font-display); font-size: 24px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.15; }
.hero-meta { font-size: 15px; color: var(--fg-2); }
.hero-actions { display: flex; gap: 10px; flex-wrap: wrap; }
.progress { height: 4px; border-radius: 2px; background: var(--fill); overflow: hidden; }
.progress > i { display: block; height: 100%; background: var(--accent-fill); border-radius: 2px; }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 44px; padding: 0 18px;
  border-radius: 12px; font-weight: 600; font-size: 16px; text-decoration: none; flex: 1 1 auto;
}
.btn svg.i { width: 20px; height: 20px; }
.btn.fill { background: var(--accent-fill); color: var(--on-accent); }
.btn.tint { background: var(--accent-soft); color: var(--accent); }
.btn.plain { color: var(--accent); }
.btn.danger { background: color-mix(in srgb, var(--danger) 12%, transparent); color: var(--danger); }
.btn:active { opacity: .7; transform: scale(.985); }
.btn.block { width: 100%; }

.tiles { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.tile { background: var(--surface); border-radius: var(--r); padding: 12px 12px 11px; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.tile .k { font-size: 13px; color: var(--fg-2); font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tile .v { font-family: var(--font-round); font-size: 26px; font-weight: 700; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; line-height: 1.15; }
.tile .v small { font-size: 15px; font-weight: 600; color: var(--fg-2); margin-left: 2px; }
.tile .s { font-size: 12px; color: var(--fg-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.banner { display: flex; gap: 12px; align-items: flex-start; background: var(--accent-soft); border-radius: var(--r); padding: 14px 14px 14px 16px; }
.banner .grow { flex: 1; min-width: 0; font-size: 15px; }
.banner strong { display: block; font-size: 16px; margin-bottom: 2px; }
.banner p { margin: 0; color: var(--fg-2); }
.banner .x { color: var(--fg-2); width: 30px; height: 30px; display: grid; place-items: center; border-radius: 50%; background: var(--fill); flex: none; }
.banner .x svg.i { width: 16px; height: 16px; stroke-width: 2.4; }
.banner .actions { display: flex; gap: 8px; margin-top: 10px; }
.banner .actions .btn { min-height: 36px; padding: 0 14px; font-size: 15px; flex: none; }
.share-glyph { display: inline-block; vertical-align: -3px; width: 17px; height: 17px; color: var(--accent); }

/* ---------- Segmented control ---------- */
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; background: var(--fill); border-radius: 9px; padding: 2px; gap: 2px; }
.seg button { min-height: 32px; border-radius: 7px; font-size: 14px; font-weight: 500; text-align: center; color: var(--fg); transition: background-color .2s; }
.seg button[aria-pressed="true"] { background: var(--surface); font-weight: 600; box-shadow: 0 2px 6px rgba(0,0,0,.12), 0 0 0 0.5px rgba(0,0,0,.04); }
:root[data-theme="dark"] .seg button[aria-pressed="true"] { background: #636366; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .seg button[aria-pressed="true"] { background: #636366; } }

/* ---------- Calendar ---------- */
.cal-head { display: flex; flex-direction: column; gap: 12px; padding: 0 16px 12px; }
.cal-period { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.cal-period .meta { font-size: 15px; color: var(--fg-2); }
.stepper { display: flex; gap: 4px; }
.stepper button { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; color: var(--accent); background: var(--accent-soft); }
.stepper button svg.i { width: 20px; height: 20px; stroke-width: 2.2; }

.weekstrip { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 2px; padding: 0 12px 6px; }
.ws-day { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 4px 0 6px; border-radius: 12px; }
.ws-day .dw { font-size: 11px; font-weight: 600; color: var(--fg-2); letter-spacing: 0.04em; text-transform: uppercase; }
.ws-day .dn { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; font-size: 19px; font-weight: 500; font-variant-numeric: tabular-nums; }
.ws-day.today .dn { color: var(--accent); font-weight: 700; }
.ws-day.sel .dn { background: var(--fg); color: var(--bg); font-weight: 700; }
.ws-day.sel.today .dn { background: var(--accent-fill); color: var(--on-accent); }
.ws-dots { display: flex; gap: 2px; height: 5px; }
.ws-dots i { width: 5px; height: 5px; border-radius: 50%; background: var(--c); }

.timeline-wrap { padding: 0 16px; }
.timeline { position: relative; background: var(--surface); border-radius: var(--r); overflow: hidden; }
.tl-hours { position: absolute; inset: 0; pointer-events: none; }
.tl-hour { position: absolute; left: 0; right: 0; height: 0; border-top: 0.5px solid var(--sep); }
.tl-hour span { position: absolute; left: 10px; top: -8px; font-size: 11px; color: var(--fg-2); background: var(--surface); padding: 0 4px; font-variant-numeric: tabular-nums; }
.tl-hour.first span { top: 4px; }
.tl-cols { position: absolute; inset: 0 0 0 58px; display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); }
.tl-col { position: relative; height: 100%; cursor: copy; }
.tl-col + .tl-col { border-left: 0.5px solid var(--sep); }
.tl-col.today-col { background: color-mix(in srgb, var(--accent) 5%, transparent); }
.ev {
  position: absolute; left: 2px; right: 3px; border-radius: 7px; padding: 4px 7px; overflow: hidden; cursor: pointer;
  background: color-mix(in srgb, var(--c) var(--mix), var(--surface)); border-left: 3px solid var(--c);
  display: flex; flex-direction: column; gap: 0; text-align: left; color: var(--fg);
}
.ev:active { filter: brightness(.95); }
.ev .t { font-size: 13px; font-weight: 600; line-height: 1.2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ev .m { font-size: 12px; color: var(--fg-2); line-height: 1.2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-variant-numeric: tabular-nums; }
.ev.off { opacity: .55; }
.ev.off .t { text-decoration: line-through; }
.ev.done::after { content: ""; position: absolute; right: 6px; top: 6px; width: 6px; height: 6px; border-radius: 50%; background: var(--good); }
.week .ev { padding: 3px 4px; border-left-width: 2px; border-radius: 5px; left: 1px; right: 1px; }
.week .ev .t { font-size: 11px; }
.week .ev .m { font-size: 10px; }
.week .ev.done::after { right: 3px; top: 3px; width: 5px; height: 5px; }
.week-head { display: grid; grid-template-columns: 58px repeat(7, minmax(0, 1fr)); padding: 0 16px 6px; }
.week-head button { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 4px 0; border-radius: 10px; }
.week-head .dw { font-size: 11px; font-weight: 600; color: var(--fg-2); text-transform: uppercase; letter-spacing: 0.04em; }
.week-head .dn { width: 30px; height: 30px; display: grid; place-items: center; border-radius: 50%; font-weight: 600; font-variant-numeric: tabular-nums; }
.week-head .today .dn { background: var(--accent-fill); color: var(--on-accent); }
.week-head .load { font-size: 10px; color: var(--fg-2); font-variant-numeric: tabular-nums; }
.now-line { position: absolute; left: 0; right: 0; height: 0; border-top: 2px solid var(--danger); z-index: 3; pointer-events: none; }
.now-line::before { content: ""; position: absolute; left: -5px; top: -6px; width: 10px; height: 10px; border-radius: 50%; background: var(--danger); }
.now-tag { position: absolute; left: 4px; z-index: 3; transform: translateY(-50%); font-size: 11px; font-weight: 700; color: #fff; background: var(--danger); padding: 1px 5px; border-radius: 6px; font-variant-numeric: tabular-nums; pointer-events: none; }

.month { padding: 0 16px; }
.month-grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); background: var(--surface); border-radius: var(--r); overflow: hidden; }
.mg-dow { font-size: 11px; font-weight: 600; color: var(--fg-2); text-align: center; padding: 10px 0 6px; text-transform: uppercase; letter-spacing: 0.04em; }
.mg-day { min-height: 64px; padding: 6px 4px; display: flex; flex-direction: column; align-items: center; gap: 4px; border-top: 0.5px solid var(--sep); }
.mg-day .dn { width: 28px; height: 28px; display: grid; place-items: center; border-radius: 50%; font-size: 16px; font-variant-numeric: tabular-nums; }
.mg-day.other .dn { color: var(--fg-3); }
.mg-day.today .dn { background: var(--accent-fill); color: var(--on-accent); font-weight: 700; }
.mg-day.sel:not(.today) .dn { background: var(--fg); color: var(--bg); font-weight: 700; }
.mg-dots { display: flex; flex-wrap: wrap; justify-content: center; gap: 2px; max-width: 34px; }
.mg-dots i { width: 6px; height: 6px; border-radius: 50%; background: var(--c); }
.mg-count { font-size: 10px; color: var(--fg-2); font-variant-numeric: tabular-nums; }
.month-list { margin-top: 20px; }

/* ---------- Students ---------- */
.search { display: flex; align-items: center; gap: 6px; background: var(--fill); border-radius: 11px; padding: 0 10px; height: 38px; margin: 0 16px 14px; }
.search svg.i { width: 18px; height: 18px; color: var(--fg-2); }
.search input { flex: 1; border: 0; background: none; outline: none; font-size: 17px; min-width: 0; }
.search input::placeholder { color: var(--fg-2); }
.student-row { --inset: 68px; }
.due { color: var(--warn); }

.profile { display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center; padding: 4px 16px 0; }
.profile h1 { margin: 6px 0 0; font-family: var(--font-display); font-size: 28px; font-weight: 700; letter-spacing: -0.02em; text-wrap: balance; }
.profile p { margin: 0; color: var(--fg-2); font-size: 15px; }
.quick { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; width: 100%; margin-top: 14px; }
.quick a, .quick button { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 10px 4px 9px; background: var(--surface); border-radius: 12px; color: var(--accent); font-size: 12px; font-weight: 500; text-decoration: none; text-align: center; }
.quick a:active, .quick button:active { background: var(--surface-2); }
.quick .disabled { color: var(--fg-3); pointer-events: none; }
.notes-card { background: var(--surface); border-radius: var(--r); padding: 14px 16px; font-size: 15px; white-space: pre-wrap; overflow-wrap: anywhere; }
.note-line { font-size: 14px; color: var(--fg-2); white-space: normal; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.hist-month { font-size: 13px; font-weight: 600; color: var(--fg-2); text-transform: uppercase; letter-spacing: 0.04em; padding: 6px 4px 0; }

/* ---------- Hours ---------- */
.big-stat { display: flex; align-items: flex-end; gap: 6px; }
.big-stat .v { font-family: var(--font-round); font-size: 56px; font-weight: 700; letter-spacing: -0.03em; line-height: 1; font-variant-numeric: tabular-nums; }
.big-stat .u { font-size: 22px; font-weight: 600; color: var(--fg-2); padding-bottom: 6px; }
.summary { background: var(--surface); border-radius: 20px; padding: 18px; display: flex; flex-direction: column; gap: 14px; }
.summary .facts { display: flex; gap: 22px; flex-wrap: wrap; font-size: 15px; color: var(--fg-2); }
.summary .facts b { color: var(--fg); font-weight: 600; font-variant-numeric: tabular-nums; }
.hbar { height: 6px; border-radius: 3px; background: var(--fill); overflow: hidden; margin-top: 6px; }
.hbar i { display: block; height: 100%; background: var(--c); border-radius: 3px; }

}
.open > .sheet { transform: translateY(0); }

.sheet-head h2 { margin: 0; font-size: 17px; font-weight: 600; text-align: center; white-space: nowrap; }
.sheet-head .nav-btn:last-child { justify-self: end; }
.sheet-head .nav-btn:first-child { justify-self: start; }
.grab { position: absolute; top: 5px; left: 50%; width: 36px; height: 5px; border-radius: 3px; background: var(--fg-3); transform: translateX(-50%); opacity: .6; }

#toast {
  position: fixed; left: 50%; bottom: calc(92px + var(--sab)); z-index: 70; transform: translate(-50%, 20px); opacity: 0; pointer-events: none;
  background: var(--fg); color: var(--bg); border-radius: 99px; padding: 10px 10px 10px 18px; font-size: 15px; font-weight: 500;
  display: flex; gap: 12px; align-items: center; max-width: calc(100% - 32px); transition: transform .35s var(--ease), opacity .25s; white-space: nowrap;
}

/* ---------- Welcome ---------- */
.welcome { min-height: calc(100vh - var(--sat) - var(--sab)); display: flex; flex-direction: column; justify-content: center; gap: 36px; padding: calc(40px + var(--sat)) 24px 40px; max-width: 460px; margin: 0 auto; }

.feature { display: flex; gap: 16px; align-items: flex-start; }
.feature svg.i { width: 30px; height: 30px; color: var(--accent); margin-top: 2px; }

/* ---------- Page transitions ---------- */
#view.push { animation: push .38s var(--ease); }
#view.pop { animation: pop .32s var(--ease); }
#view.fade { animation: fade .22s ease-out; }
@keyframes push { from { transform: translateX(28%); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes pop { from { transform: translateX(-18%); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 1ms !important; transition-duration: 1ms !important; }
}
@media (min-width: 700px) {
  .sheet { bottom: auto; top: 50%; border-radius: 16px; transform: translateY(-46%) scale(.98); opacity: 0; transition: transform .3s var(--ease), opacity .2s; max-height: 86vh; }

  .grab { display: none; }

<body>
<div id="app"><div id="view"></div></div>

<script>
(() => {
'use strict';

/* =========================================================
   Utilities
   ========================================================= */
const EMBED = !!window.CADENCE_EMBED;
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const uid = () => Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-5);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const pad = n => String(n).padStart(2, '0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const hm = d => `${pad(d.getHours())}:${pad(d.getMinutes())}`;
const parseDate = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const parseDT = s => { const [ds, ts = '00:00'] = s.split('T'); const d = parseDate(ds); const [h, mi] = ts.split(':').map(Number); d.setHours(h, mi, 0, 0); return d; };
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
const startOfDay = d => { const x = new Date(d); x.setHours(0, 0, 0, 0); return x; };
const startOfWeek = d => { const x = startOfDay(d); return addDays(x, -((x.getDay() + 6) % 7)); };
const sameDay = (a, b) => a.getFullYear() === b.getFullYear() && a.getMonth() === b.getMonth() && a.getDate() === b.getDate();
const dayDiff = (a, b) => Math.round((startOfDay(a) - startOfDay(b)) / 864e5);
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));

const F = (o) => new Intl.DateTimeFormat(undefined, o);
const fTime = F({ hour: 'numeric', minute: '2-digit' });
const fDayLong = F({ weekday: 'long', day: 'numeric', month: 'long' });
const fDayShort = F({ weekday: 'short', day: 'numeric', month: 'short' });
const fWd = F({ weekday: 'short' });
const fWdLong = F({ weekday: 'long' });
const fMonthYear = F({ month: 'long', year: 'numeric' });
const fMonth = F({ month: 'long' });
const fDM = F({ day: 'numeric', month: 'short' });
const fDMY = F({ day: 'numeric', month: 'short', year: 'numeric' });
const fNum = new Intl.NumberFormat(undefined, { maximumFractionDigits: 2 });
const fNum1 = new Intl.NumberFormat(undefined, { maximumFractionDigits: 1 });
const fHour = h => { const d = new Date(2000, 0, 1, h); return F({ hour: 'numeric' }).format(d); };

const time = d => fTime.format(d);
const hrs = min => fNum.format(min / 60);
const dur = m => m < 60 ? `${m} min` : (m % 60 ? `${Math.floor(m / 60)} h ${m % 60} min` : `${m / 60} h`);
const money = v => `${db.settings.currency}${new Intl.NumberFormat(undefined, { minimumFractionDigits: v % 1 ? 2 : 0, maximumFractionDigits: 2 }).format(v)}`;
const plural = (n, one, many = one + 's') => `${n} ${n === 1 ? one : many}`;
const initials = name => (name || '?').trim().split(/\s+/).slice(0, 2).map(p => p[0]).join('').toUpperCase();
const firstName = name => (name || '').trim().split(/\s+/)[0] || '';

function relPast(d, now = new Date()) {
  const n = dayDiff(now, d);
  if (n <= 0) return 'Today';
  if (n === 1) return 'Yesterday';
  if (n < 7) return `${n} days ago`;
  if (n < 35) { const w = Math.round(n / 7); return w === 1 ? 'A week ago' : `${w} weeks ago`; }
  return (d.getFullYear() === now.getFullYear() ? fDM : fDMY).format(d);
}
function relFuture(d, now = new Date()) {
  const n = dayDiff(d, now);
  if (n === 0) {
    const mins = Math.round((d - now) / 60000);
    if (mins <= 0) return 'Now';
    if (mins < 60) return `In ${mins} min`;
    const h = Math.floor(mins / 60), m = mins % 60;
    return m ? `In ${h} h ${m} min` : `In ${h} h`;
  }
  if (n === 1) return `Tomorrow, ${time(d)}`;
  if (n < 7) return `${fWdLong.format(d)}, ${time(d)}`;
  return `${fDayShort.format(d)}, ${time(d)}`;
}

const COLORS = ['#5856D6', '#007AFF', '#32ADE6', '#30B0A0', '#34A853', '#FF9500', '#FF3B30', '#FF2D55', '#AF52DE', '#A2845E'];
const INSTRUMENTS = ['Piano', 'Voice', 'Violin', 'Viola', 'Cello', 'Double Bass', 'Guitar', 'Bass Guitar', 'Flute', 'Clarinet', 'Saxophone', 'Trumpet', 'Trombone', 'French Horn', 'Drums', 'Percussion', 'Organ', 'Harp', 'Composition', 'Music Theory', 'Aural Skills', 'Conducting'];

const ICON = {
  today: '<circle cx="12" cy="12" r="4.2"/><path d="M12 2.6v2.1M12 19.3v2.1M4.7 4.7l1.5 1.5M17.8 17.8l1.5 1.5M2.6 12h2.1M19.3 12h2.1M4.7 19.3l1.5-1.5M17.8 6.2l1.5-1.5"/>',
  calendar: '<rect x="3.5" y="5" width="17" height="15.5" rx="3.2"/><path d="M3.5 10h17M8 3v4M16 3v4"/><circle cx="8.5" cy="14.5" r=".6" fill="currentColor"/><circle cx="12" cy="14.5" r=".6" fill="currentColor"/><circle cx="15.5" cy="14.5" r=".6" fill="currentColor"/>',
  students: '<circle cx="9" cy="8.3" r="3.5"/><path d="M2.8 19.6c.8-3.3 3.3-5.1 6.2-5.1s5.4 1.8 6.2 5.1"/><circle cx="17.2" cy="9.4" r="2.6"/><path d="M16.6 14.6c2.4 0 4.1 1.5 4.7 4"/>',
  hours: '<circle cx="12" cy="12" r="8.6"/><path d="M12 7.3V12l3.2 2"/>',
  plus: '<path d="M12 5v14M5 12h14"/>',
  settings: '<path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/>',
  chevR: '<path d="M9.5 5.5 16 12l-6.5 6.5"/>',
  chevL: '<path d="M14.5 5.5 8 12l6.5 6.5"/>',
  chat: '<path d="M20.5 11.6a8.4 8.4 0 0 1-12.4 7.4L3.5 20.4l1.4-4.4a8.4 8.4 0 1 1 15.6-4.4Z"/>',
  phone: '<path d="M6.6 3.5h2.6l1.4 4.1-2 1.4a11.5 11.5 0 0 0 6.4 6.4l1.4-2 4.1 1.4v2.6a2 2 0 0 1-2.2 2A16.8 16.8 0 0 1 4.6 5.7a2 2 0 0 1 2-2.2Z"/>',
  mail: '<rect x="3.5" y="5.5" width="17" height="13" rx="2.5"/><path d="m4.5 7 7.5 6 7.5-6"/>',
  search: '<circle cx="10.8" cy="10.8" r="6.3"/><path d="m15.5 15.5 4.5 4.5"/>',
  x: '<path d="M6 6l12 12M18 6 6 18"/>',
  note: '<path d="M14.5 4.5l5 5L9 20H4v-5Z"/><path d="m12.5 6.5 5 5"/>',
  music: '<path d="M9 18V5.5l11-2.2V16"/><circle cx="6.5" cy="18" r="2.5"/><circle cx="17.5" cy="16" r="2.5"/>',
  repeat: '<path d="M4 11V9a3 3 0 0 1 3-3h12l-3-3M20 13v2a3 3 0 0 1-3 3H5l3 3"/>',
  chart: '<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>',
  lock: '<rect x="5" y="10.5" width="14" height="10" rx="2.5"/><path d="M8 10.5V7.5a4 4 0 0 1 8 0v3"/>',
  share: '<path d="M12 15V3.5M8 7.2l4-3.7 4 3.7"/><path d="M8.5 10.5H7a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-6a2 2 0 0 0-2-2h-1.5"/>',
  alert: '<path d="M12 4 2.8 19.5h18.4Z"/><path d="M12 10v4.2"/><circle cx="12" cy="17" r=".6" fill="currentColor"/>',
};
const icon = (n, cls = 'i') => `<svg class="${cls}" viewBox="0 0 24 24" aria-hidden="true">${ICON[n]}</svg>`;
const APP_MARK = `<svg class="mark" viewBox="0 0 512 512" aria-hidden="true"><defs><linearGradient id="mk" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6461F0"/><stop offset="1" stop-color="#3B38B8"/></linearGradient></defs><rect width="512" height="512" rx="114" fill="url(#mk)"/><g fill="#fff"><rect x="96" y="104" width="320" height="16" rx="8" opacity=".22"/><rect x="96" y="160" width="320" height="16" rx="8" opacity=".22"/><rect x="96" y="216" width="320" height="16" rx="8" opacity=".22"/><rect x="96" y="272" width="320" height="16" rx="8" opacity=".22"/><rect x="96" y="328" width="320" height="16" rx="8" opacity=".22"/><ellipse cx="190" cy="372" rx="54" ry="40" transform="rotate(-22 190 372)"/><ellipse cx="350" cy="336" rx="54" ry="40" transform="rotate(-22 350 336)"/><rect x="226" y="140" width="22" height="236" rx="6"/><rect x="386" y="104" width="22" height="236" rx="6"/><path d="M226 140 408 104v58l-182 36Z"/></g></svg>`;

/* =========================================================
   Data
   ========================================================= */
const KEY = 'cadence.v1';
const HORIZON_WEEKS = 16;
const blank = () => ({
  version: 1,
  students: [], lessons: [], series: [],
  settings: { termStart: '', termEnd: '', currency: '€', country: '353', dayStart: 8, dayEnd: 21, staleDays: 14, defaultDuration: 60 },
  meta: { started: false, sample: false, lastBackup: null, installDismissed: false },
});
function normalize(d) {
  const b = blank();
  return {
    ...b, ...d,
    students: Array.isArray(d.students) ? d.students : [],
    lessons: Array.isArray(d.lessons) ? d.lessons : [],
    series: Array.isArray(d.series) ? d.series : [],
    settings: { ...b.settings, ...(d.settings || {}) },
    meta: { ...b.meta, ...(d.meta || {}) },
  };
}
function load() {
  try { const raw = localStorage.getItem(KEY); if (raw) return normalize(JSON.parse(raw)); } catch (e) { /* storage unavailable */ }
  return blank();
}
let saveWarned = false;
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(db)); }
  catch (e) { if (!saveWarned && !EMBED) { saveWarned = true; toast('Changes could not be saved on this device'); } }
}
let db = load();

const stu = id => db.students.find(s => s.id === id);
const lessonEnd = l => new Date(parseDT(l.start).getTime() + l.duration * 60000);
function stateOf(l, now = new Date()) {
  if (l.status === 'cancelled') return 'cancelled';
  if (l.status === 'missed') return 'missed';
  if (lessonEnd(l) <= now) return 'taught';
  if (parseDT(l.start) <= now) return 'live';
  return 'upcoming';
}
const isOff = st => st === 'cancelled' || st === 'missed';
const sortLessons = arr => arr.sort((a, b) => a.start < b.start ? -1 : a.start > b.start ? 1 : 0);
function lessonsBetween(from, to) {
  const a = ymd(from) + 'T00:00', b = ymd(to) + 'T00:00';
  return sortLessons(db.lessons.filter(l => l.start >= a && l.start < b));
}
function indexByStudent() {
  const m = new Map();
  for (const l of db.lessons) { if (!m.has(l.studentId)) m.set(l.studentId, []); m.get(l.studentId).push(l); }
  for (const a of m.values()) sortLessons(a);
  return m;
}
function statsFor(list, now = new Date()) {
  let last = null, next = null, taughtMin = 0, taught = 0;
  for (const l of list || []) {
    const st = stateOf(l, now);
    if (st === 'taught') { taught++; taughtMin += l.duration; last = l; }
    else if ((st === 'upcoming' || st === 'live') && !next) next = l;
  }
  return { last, next, taughtMin, taught };
}
function termRange() {
  const s = db.settings;
  if (!s.termStart) return null;
  const from = parseDate(s.termStart);
  const to = s.termEnd ? addDays(parseDate(s.termEnd), 1) : addDays(startOfDay(new Date()), 3650);
  return { from, to };
}
function minutesIn(list, from, to, states = ['taught']) {
  const a = ymd(from) + 'T00:00', b = ymd(to) + 'T00:00';
  let m = 0; for (const l of list || []) if (l.start >= a && l.start < b && states.includes(stateOf(l))) m += l.duration;
  return m;
}

/* Weekly lessons are stored as a series and materialised as real lessons
   up to HORIZON_WEEKS ahead, so every lesson can carry its own notes and status. */
function extendSeries() {
  const horizon = addDays(startOfDay(new Date()), HORIZON_WEEKS * 7);
  let changed = false;
  for (const s of db.series) {
    const from = s.generatedUntil ? addDays(parseDate(s.generatedUntil), 1) : parseDate(s.startDate);
    let end = horizon;
    if (s.until) { const u = parseDate(s.until); if (u < end) end = u; }
    if (end < from) continue;
    let d = new Date(from);
    while (d.getDay() !== s.weekday) d = addDays(d, 1);
    for (; d <= end; d = addDays(d, 7)) {
      db.lessons.push({ id: uid(), studentId: s.studentId, start: `${ymd(d)}T${s.time}`, duration: s.duration, status: 'scheduled', notes: '', seriesId: s.id });
      changed = true;
    }
    s.generatedUntil = ymd(end);
    changed = true;
  }
  return changed;
}
function addSeries(studentId, startDate, timeStr, duration) {
  const sd = parseDate(startDate);
  const s = { id: uid(), studentId, weekday: sd.getDay(), time: timeStr, duration, startDate, until: '', generatedUntil: '' };
  db.series.push(s);
  extendSeries();
  return s;
}
/* Ends a weekly series: removes its future, untouched lessons. Past lessons stay in the history. */
function endSeries(seriesId) {
  const now = new Date();
  db.lessons = db.lessons.filter(l => !(l.seriesId === seriesId && parseDT(l.start) > now && l.status === 'scheduled' && !l.notes));
  db.series = db.series.filter(s => s.id !== seriesId);
}
function nextDateFor(weekday, timeStr) {
  const now = new Date();
  let d = startOfDay(now);
  for (let i = 0; i < 8; i++) {
    const c = addDays(d, i);
    if (c.getDay() === weekday) {
      const [h, m] = timeStr.split(':').map(Number); const dt = new Date(c); dt.setHours(h, m);
      if (dt > now) return ymd(c);
    }
  }
  return ymd(addDays(d, 7));
}
function clashes(start, duration, ignoreId) {
  const s = parseDT(start).getTime(), e = s + duration * 60000;
  return db.lessons.filter(l => l.id !== ignoreId && !isOff(stateOf(l)) && (() => {
    const ls = parseDT(l.start).getTime(), le = ls + l.duration * 60000; return ls < e && s < le;
  })());
}
function seriesLabel(s) {
  const d = parseDate(s.startDate);
  const t = new Date(2000, 0, 1, ...s.time.split(':').map(Number));
  return { day: fWdLong.format(d) + 's', when: `${time(t)} · ${dur(s.duration)}` };
}

/* Phone numbers become WhatsApp links. Local numbers (leading 0) take the country code from Settings. */
function waNumber(p) {
  if (!p) return '';
  let t = p.replace(/[^\d+]/g, '');
  if (t.startsWith('+')) return t.slice(1);
  if (t.startsWith('00')) return t.slice(2);
  if (t.startsWith('0')) return (db.settings.country || '') + t.slice(1);
  return t;
}
const waLink = (s, text = '') => { const n = waNumber(s?.phone); return n ? `https://wa.me/${n}${text ? '?text=' + encodeURIComponent(text) : ''}` : ''; };
function reminderText(l) {
  const s = stu(l.studentId); const d = parseDT(l.start); const n = dayDiff(d, new Date());
  const when = n === 0 ? `today at ${time(d)}` : n === 1 ? `tomorrow at ${time(d)}` : `on ${fDayLong.format(d)} at ${time(d)}`;
  return `Hi ${firstName(s?.name)}, just a reminder about your ${s?.instrument ? s.instrument.toLowerCase() + ' ' : ''}lesson ${when}. See you then!`;
}

  const notesPool = [

  const students = people.map(([name, instrument, phone, notes, c]) => ({
    id: uid(), name, instrument, phone, email: '', notes, color: COLORS[c], rate: 45, hoursAllocated: 10, archived: false, createdAt: ymd(termStart),
  }));
  const lessons = [], series = [];
  db = normalize({ students, lessons, series, settings: { ...blank().settings, termStart: ymd(termStart), termEnd: ymd(addDays(mon, 7 * 7 + 4)) }, meta: { ...db.meta, started: true, sample: true } });
  people.forEach(([, , , , , slots], i) => {
    for (const [wd, t, d] of slots) {
      const first = addDays(termStart, (wd + 6) % 7);
      db.series.push({ id: uid(), studentId: students[i].id, weekday: wd, time: t, duration: d, startDate: ymd(first), until: '', generatedUntil: '' });
    }
  });
  extendSeries();
  // Ad-hoc lessons: Liam came three times early in term; Róisín is booked in later this week.
  [-33, -26, -19].forEach((o, k) => db.lessons.push({ id: uid(), studentId: students[7].id, start: `${ymd(addDays(mon, o))}T17:00`, duration: 60, status: 'scheduled', notes: k === 0 ? 'Four-part writing, parallel fifths. Exercises 3–6 for next week.' : '', seriesId: null }));
  db.lessons.push({ id: uid(), studentId: students[8].id, start: `${ymd(addDays(today, 2))}T12:00`, duration: 30, status: 'scheduled', notes: '', seriesId: null });
  db.lessons.push({ id: uid(), studentId: students[8].id, start: `${ymd(addDays(mon, -8))}T12:00`, duration: 30, status: 'scheduled', notes: 'First lesson. Assessed sight-reading, set Bach Invention no. 4.', seriesId: null });
  // History: notes on most past lessons, a few cancellations, one no-show.
  const now = new Date(); let k = 0;
  for (const l of sortLessons(db.lessons)) {

    k++;
    if (k % 11 === 4) { l.status = 'cancelled'; l.notes = 'Student unwell.'; continue; }
    if (k === 9) { l.status = 'missed'; continue; }
    if (k % 3 !== 0 && dayDiff(now, parseDT(l.start)) > 3) l.notes = notesPool[k % notesPool.length];
  }
  save();
}

const ui = {

function render() {
  const top = ui.stack[ui.stack.length - 1];

/* ---------- Today ---------- */
function viewToday() {
  const now = new Date(); const today = startOfDay(now);
  const todays = lessonsBetween(today, addDays(today, 1));
  const upcoming = sortLessons(db.lessons.filter(l => { const st = stateOf(l, now); return (st === 'upcoming' || st === 'live') && stu(l.studentId); }));
  const next = upcoming[0];
  const wk = startOfWeek(today);
  const weekL = lessonsBetween(wk, addDays(wk, 7)).filter(l => !isOff(stateOf(l)));
  const weekMin = weekL.reduce((a, l) => a + l.duration, 0);
  const weekDone = weekL.filter(l => stateOf(l) === 'taught').reduce((a, l) => a + l.duration, 0);
  const term = termRange();
  const termMin = term ? minutesIn(db.lessons, term.from, term.to) : minutesIn(db.lessons, new Date(today.getFullYear(), today.getMonth(), 1), addDays(today, 1));
  const todayOn = todays.filter(l => !isOff(stateOf(l)));

  let html = navbar({ title: 'Today', left: navIcon('settings', 'settings', 'Settings'), right: navIcon('new-lesson', 'plus', 'New lesson') });
  html += `<header class="large"><p class="eyebrow">${esc(fDayLong.format(now))}</p><h1>Today</h1></header><main>`;

  if (db.meta.sample) html += `<div class="banner"><div class="grow"><strong>You're looking at sample students</strong><p>Try things out, then clear them when you're ready to add your own.</p><div class="actions"><button class="btn fill" data-act="clear-sample">Clear sample data</button></div></div></div>`;
  html += installBanner();

  if (next) {
    const s = stu(next.studentId); const d = parseDT(next.start); const e = lessonEnd(next); const live = stateOf(next, now) === 'live';
    const pct = live ? clamp((now - d) / (e - d) * 100, 0, 100) : 0;
    const wa = waLink(s, live ? '' : reminderText(next));
    html += `<section class="hero" style="--c:${s.color}" aria-label="Next lesson">
      <div class="hero-top"><span class="hero-label${live ? ' now' : ''}">${live ? 'In lesson now' : 'Up next'}</span><span class="hero-when">${esc(live ? `Ends ${time(e)}` : relFuture(d, now))}</span></div>
      <div class="hero-who">${avatar(s)}<div class="grow" style="min-width:0"><div class="hero-name">${esc(s.name)}</div><div class="hero-meta num">${esc([s.instrument, `${time(d)}–${time(e)}`].filter(Boolean).join(' · '))}</div></div></div>
      ${live ? `<div class="progress" role="progressbar" aria-valuenow="${Math.round(pct)}" aria-valuemin="0" aria-valuemax="100"><i style="width:${pct}%"></i></div>` : ''}
      <div class="hero-actions">
        ${wa ? `<a class="btn tint" href="${esc(wa)}" target="_blank" rel="noopener">${icon('chat')}${live ? 'Message' : 'Send reminder'}</a>` : ''}
        <button class="btn tint" data-act="edit-lesson" data-id="${next.id}">${icon('note')}${live ? 'Lesson notes' : 'Details'}</button>
      </div>
    </section>`;
  } else if (db.students.length) {
    html += `<section class="hero" style="--c:var(--accent)"><div class="hero-top"><span class="hero-label">Up next</span></div><div class="hero-name">Nothing booked</div><div class="hero-meta">Book a lesson or set a weekly slot on a student.</div><div class="hero-actions"><button class="btn fill" data-act="new-lesson">${icon('plus')}Book a lesson</button></div></section>`;
  }

  html += `<div class="tiles">
    <div class="tile"><span class="k">Today</span><span class="v">${todayOn.length}</span><span class="s">${todayOn.length === 1 ? 'lesson' : 'lessons'} · ${hrs(todayOn.reduce((a, l) => a + l.duration, 0))} h</span></div>
    <div class="tile"><span class="k">This week</span><span class="v">${hrs(weekMin)}<small>h</small></span><span class="s">${hrs(weekDone)} h done</span></div>
    <div class="tile"><span class="k">${term ? 'This term' : fMonth.format(now)}</span><span class="v">${hrs(termMin)}<small>h</small></span><span class="s">${term ? 'since ' + fDM.format(term.from) : 'taught'}</span></div>
  </div>`;

  html += `<section class="section"><div class="section-h"><h2>Schedule</h2><button class="link" data-act="goto-cal">Calendar</button></div>
    <div class="group">${todays.length ? todays.map(l => lessonRow(l)).join('') : `<div class="empty">No lessons today.</div>`}</div></section>`;

  // Tomorrow preview keeps the evening-before check quick.
  const tmr = lessonsBetween(addDays(today, 1), addDays(today, 2));
  if (tmr.length) html += `<section class="section"><div class="section-h"><h2>Tomorrow</h2><span class="meta">${plural(tmr.length, 'lesson')}</span></div><div class="group">${tmr.map(l => lessonRow(l)).join('')}</div></section>`;

  // Students drifting away: nothing booked soon and not seen for a while.
  const idx = indexByStudent();
  const stale = db.students.filter(s => !s.archived).map(s => {
    const st = statsFor(idx.get(s.id), now);
    const soon = st.next && dayDiff(parseDT(st.next.start), now) <= 14;
    const gap = st.last ? dayDiff(now, parseDT(st.last.start)) : Infinity;
    return { s, st, soon, gap };
  }).filter(x => !x.soon && x.gap >= db.settings.staleDays).sort((a, b) => b.gap - a.gap);
  if (stale.length) {
    html += `<section class="section"><div class="section-h"><h2>Check in with</h2><span class="meta">Nothing booked</span></div><div class="group">${stale.slice(0, 5).map(({ s, st }) => `
      <div class="row student-row">${avatar(s)}<button class="grow" data-act="open-student" data-id="${s.id}" style="text-align:left"><div class="title">${esc(s.name)}</div><div class="sub due">${st.last ? 'Last lesson ' + esc(relPast(parseDT(st.last.start), now).toLowerCase()) : 'No lessons yet'}</div></button>

  }

  // Recent lessons without notes.

  const un = db.lessons.filter(l => !l.notes && stateOf(l, now) === 'taught' && parseDT(l.start) >= week && stu(l.studentId)).sort((a, b) => a.start < b.start ? 1 : -1).slice(0, 4);
  if (un.length) {
    html += `<section class="section"><div class="section-h"><h2>Add lesson notes</h2><span class="meta">${plural(un.length, 'lesson')}</span></div><div class="group">${un.map(l => { const s = stu(l.studentId); const d = parseDT(l.start); return `
      <button class="row student-row" data-act="edit-lesson" data-id="${l.id}" data-focus="notes">${avatar(s)}<div class="grow"><div class="title">${esc(s.name)}</div><div class="sub">${esc(relPast(d, now))}, ${time(d)} · What did you cover?</div></div>${icon('note', 'i chev')}</button>`; }).join('')}</div></section>`;
  }

  if (!db.students.length) {
    html += `<section class="section"><div class="group"><div class="empty"><p style="margin:0 0 12px">Add your students to start filling your calendar.</p><button class="btn fill" data-act="new-student">${icon('plus')}Add a student</button></div></div></section>`;
  }
  return html + '</main>';
}

  const left = `<button class="nav-btn" data-act="cal-today">Today</button>`;
  let title, meta = '';

  else if (c.mode === 'week') {

    title = w.getMonth() === e.getMonth() ? fMonthYear.format(w) : `${fDM.format(w)} – ${fDM.format(e)}`;
    const ls = lessonsBetween(w, addDays(w, 7)).filter(l => !isOff(stateOf(l)));
    meta = `${plural(ls.length, 'lesson')} · ${hrs(ls.reduce((a, l) => a + l.duration, 0))} h`;
  } else {
    title = fMonthYear.format(c.date);
    const ls = lessonsBetween(c.date, addDays(c.date, 1)).filter(l => !isOff(stateOf(l)));
    meta = `${fDayLong.format(c.date)}${ls.length ? ' · ' + plural(ls.length, 'lesson') : ''}`;
  }
  let html = navbar({ title, left, right });
  html += `<header class="large"><h1>${esc(title)}</h1></header>`;
  html += `<div class="cal-head">
    <div class="seg" role="group" aria-label="Calendar view">${[['day', 'Day'], ['week', 'Week'], ['month', 'Month']].map(([k, l]) => `<button data-act="cal-mode" data-mode="${k}" aria-pressed="${c.mode === k}">${l}</button>`).join('')}</div>
    <div class="cal-period"><span class="meta num">${esc(meta)}</span><div class="stepper"><button data-act="cal-step" data-dir="-1" aria-label="Previous">${icon('chevL')}</button><button data-act="cal-step" data-dir="1" aria-label="Next">${icon('chevR')}</button></div></div>
  </div>`;
  html += `<div class="swipe-zone">`;
  if (c.mode === 'day') html += weekStrip(c.date, now) + timeline([c.date], now, 64);
  else if (c.mode === 'week') html += weekHead(startOfWeek(c.date), now) + timeline(Array.from({ length: 7 }, (_, i) => addDays(startOfWeek(c.date), i)), now, 48, true);
  else html += monthGrid(c.date, now);
  html += `</div>`;
  if (c.mode === 'month') {

  }
  return html;
}
function weekStrip(sel, now) {
  const w = startOfWeek(sel);
  return `<div class="weekstrip">${Array.from({ length: 7 }, (_, i) => {
    const d = addDays(w, i); const ls = lessonsBetween(d, addDays(d, 1)).filter(l => !isOff(stateOf(l)));

/* Lays overlapping lessons side by side within a day column. */
function layoutDay(ls) {
  const items = ls.map(l => ({ l, s: parseDT(l.start).getTime(), e: lessonEnd(l).getTime(), col: 0, cols: 1 }));
  let cluster = [], clusterEnd = 0;
  const flush = () => { const n = Math.max(1, ...cluster.map(x => x.col + 1)); cluster.forEach(x => x.cols = n); cluster = []; };
  for (const it of items) {
    if (cluster.length && it.s >= clusterEnd) flush();
    const used = new Set(cluster.filter(x => x.e > it.s).map(x => x.col));
    let c = 0; while (used.has(c)) c++;
    it.col = c; cluster.push(it); clusterEnd = Math.max(clusterEnd, it.e);
  }
  flush();
  return items;
}
function timeline(days, now, hourH, compact = false) {
  let start = db.settings.dayStart, end = db.settings.dayEnd;
  const all = days.map(d => lessonsBetween(d, addDays(d, 1)));
  for (const ls of all) for (const l of ls) {
    const s = parseDT(l.start); const e = lessonEnd(l);
    start = Math.min(start, s.getHours());
    end = Math.max(end, e.getHours() + (e.getMinutes() ? 1 : 0));
  }
  if (days.some(d => sameDay(d, now))) { start = Math.min(start, now.getHours()); end = Math.max(end, now.getHours() + 1); }
  end = Math.min(24, Math.max(end, start + 1));
  const H = (end - start) * hourH;
  let hours = '';
  for (let h = start; h <= end; h++) hours += `<div class="tl-hour${h === start ? ' first' : ''}" style="top:${(h - start) * hourH}px">${h < end ? `<span>${esc(fHour(h))}</span>` : ''}</div>`;
  const cols = days.map((d, i) => {
    const evs = layoutDay(all[i]).map(({ l, col, cols }) => {
      const s = stu(l.studentId); const sd = parseDT(l.start); const st = stateOf(l, now);
      const top = ((sd.getHours() - start) * 60 + sd.getMinutes()) / 60 * hourH;
      const h = Math.max(compact ? 20 : 24, l.duration / 60 * hourH - 2);
      const w = 100 / cols;
      const name = compact ? firstName(s?.name) : (s?.name || 'Former student');
      const meta = compact ? time(sd) : `${time(sd)} · ${dur(l.duration)}${s?.instrument ? ' · ' + s.instrument : ''}`;
      return `<button class="ev${isOff(st) ? ' off' : ''}${st === 'taught' && !compact ? ' done' : ''}" data-act="edit-lesson" data-id="${l.id}" style="--c:${s?.color || COLORS[0]};top:${top + 1}px;height:${h}px;left:calc(${col * w}% + 2px);right:auto;width:calc(${w}% - 4px)" aria-label="${esc((s?.name || '') + ', ' + time(sd))}"><span class="t">${esc(name)}</span>${h > 30 ? `<span class="m">${esc(meta)}</span>` : ''}</button>`;
    }).join('');
    let nowLine = '';
    if (sameDay(d, now)) { const y = ((now.getHours() - start) * 60 + now.getMinutes()) / 60 * hourH; nowLine = `<div class="now-line" style="top:${y}px"></div>`; }
    return `<div class="tl-col${days.length > 1 && sameDay(d, now) ? ' today-col' : ''}" data-act="cal-slot" data-date="${ymd(d)}" data-start="${start}" data-hh="${hourH}">${evs}${nowLine}</div>`;
  }).join('');
  let tag = '';
  if (!compact && days.some(d => sameDay(d, now))) { const y = ((now.getHours() - start) * 60 + now.getMinutes()) / 60 * hourH; tag = `<span class="now-tag" style="top:${y}px">${esc(time(now))}</span>`; }
  return `<div class="timeline-wrap${compact ? ' week' : ''}"><div class="timeline" style="height:${H}px"><div class="tl-hours">${hours}</div><div class="tl-cols">${cols}</div>${tag}</div></div>`;
}
function monthGrid(sel, now) {
  const first = new Date(sel.getFullYear(), sel.getMonth(), 1);
  const gs = startOfWeek(first);
  const last = new Date(sel.getFullYear(), sel.getMonth() + 1, 0);
  const weeks = Math.ceil((dayDiff(last, gs) + 1) / 7);
  const ls = lessonsBetween(gs, addDays(gs, weeks * 7)).filter(l => !isOff(stateOf(l)));
  const byDay = new Map(); for (const l of ls) { const k = l.start.slice(0, 10); if (!byDay.has(k)) byDay.set(k, []); byDay.get(k).push(l); }
  let html = `<div class="month"><div class="month-grid">`;
  for (let i = 0; i < 7; i++) html += `<div class="mg-dow">${esc(fWd.format(addDays(gs, i)).slice(0, 1))}</div>`;
  for (let i = 0; i < weeks * 7; i++) {
    const d = addDays(gs, i); const day = byDay.get(ymd(d)) || [];
    html += `<button class="mg-day${d.getMonth() !== sel.getMonth() ? ' other' : ''}${sameDay(d, now) ? ' today' : ''}${sameDay(d, sel) ? ' sel' : ''}" data-act="cal-pick" data-date="${ymd(d)}" data-stay="1" aria-label="${esc(fDayLong.format(d))}${day.length ? ', ' + plural(day.length, 'lesson') : ''}"><span class="dn">${d.getDate()}</span><span class="mg-dots">${day.slice(0, 6).map(l => `<i style="--c:${stu(l.studentId)?.color || COLORS[0]}"></i>`).join('')}</span>${day.length > 6 ? `<span class="mg-count">+${day.length - 6}</span>` : ''}</button>`;
  }
  return html + `</div></div>`;
}

/* ---------- Hours ---------- */
function hoursRange() {
  const h = ui.hours; const a = h.anchor; const today = startOfDay(new Date());
  if (h.range === 'week') { const s = startOfWeek(a); return { from: s, to: addDays(s, 7), label: `${fDM.format(s)} – ${fDM.format(addDays(s, 6))}`, step: true }; }
  if (h.range === 'month') { const s = new Date(a.getFullYear(), a.getMonth(), 1); return { from: s, to: new Date(a.getFullYear(), a.getMonth() + 1, 1), label: fMonthYear.format(s), step: true }; }
  if (h.range === 'term') { const t = termRange(); if (t) return { ...t, label: `${fDM.format(t.from)} – ${db.settings.termEnd ? fDMY.format(parseDate(db.settings.termEnd)) : 'now'}`, step: false }; }
  const first = db.lessons.reduce((m, l) => l.start < m ? l.start : m, ymd(today) + 'T00');
  return { from: parseDate(first.slice(0, 10)), to: addDays(today, 3650), label: 'All time', step: false };
}
function viewHours() {
  const r = hoursRange(); const now = new Date();
  const a = ymd(r.from) + 'T00:00', b = ymd(r.to) + 'T00:00';
  const inRange = db.lessons.filter(l => l.start >= a && l.start < b);
  const per = new Map();
  let taughtMin = 0, taughtN = 0, bookedMin = 0, cancelled = 0, missed = 0, earn = 0;
  for (const l of inRange) {
    const st = stateOf(l, now); const s = stu(l.studentId); if (!s) continue;
    if (!per.has(s.id)) per.set(s.id, { s, min: 0, n: 0, booked: 0, off: 0 });
    const p = per.get(s.id);
    if (st === 'taught') { p.min += l.duration; p.n++; taughtMin += l.duration; taughtN++; earn += (Number(s.rate) || 0) * l.duration / 60; }
    else if (st === 'upcoming' || st === 'live') { p.booked += l.duration; bookedMin += l.duration; }
    else { p.off++; st === 'cancelled' ? cancelled++ : missed++; }
  }
  const rows = [...per.values()].sort((x, y) => y.min - x.min || y.booked - x.booked || x.s.name.localeCompare(y.s.name));
  const max = Math.max(1, ...rows.map(p => p.min + p.booked));
  let html = navbar({ title: 'Hours', left: navIcon('settings', 'settings', 'Settings'), right: `<button class="nav-btn" data-act="export-csv">Export</button>` });
  html += `<header class="large"><p class="eyebrow">Teaching record</p><h1>Hours</h1></header>`;
  html += `<div class="cal-head"><div class="seg" role="group" aria-label="Period">${[['week', 'Week'], ['month', 'Month'], ['term', 'Term'], ['all', 'All']].map(([k, l]) => `<button data-act="hours-range" data-range="${k}" aria-pressed="${ui.hours.range === k}">${l}</button>`).join('')}</div>
    <div class="cal-period"><span class="meta num">${esc(r.label)}</span>${r.step ? `<div class="stepper"><button data-act="hours-step" data-dir="-1" aria-label="Previous">${icon('chevL')}</button><button data-act="hours-step" data-dir="1" aria-label="Next">${icon('chevR')}</button></div>` : ''}</div></div><main>`;
  html += `<div class="summary"><div class="big-stat"><span class="v">${hrs(taughtMin)}</span><span class="u">hours taught</span></div>
    <div class="facts"><span><b>${taughtN}</b> lessons</span>${bookedMin ? `<span><b>${hrs(bookedMin)} h</b> still booked</span>` : ''}${cancelled ? `<span><b>${cancelled}</b> cancelled</span>` : ''}${missed ? `<span><b>${missed}</b> missed</span>` : ''}${earn ? `<span><b>${esc(money(Math.round(earn * 100) / 100))}</b> at your rates</span>` : ''}</div></div>`;
  html += `<section class="section"><div class="section-h"><h2>By student</h2><span class="meta">${plural(rows.length, 'student')}</span></div><div class="group">${rows.length ? rows.map(p => {
    const alloc = ui.hours.range === 'term' && Number(p.s.hoursAllocated) ? ` of ${fNum.format(p.s.hoursAllocated)} h` : '';
    return `<button class="row hours-row" data-act="open-student" data-id="${p.s.id}" style="--c:${p.s.color}">${avatar(p.s)}<div class="grow"><div class="title">${esc(p.s.name)}</div><div class="hbar"><i style="width:${(p.min / max) * 100}%"></i></div></div><div class="fig"><b>${hrs(p.min)} h${esc(alloc)}</b><span>${plural(p.n, 'lesson')}${p.booked ? ` · +${hrs(p.booked)} h` : ''}</span></div></button>`;
  }).join('') : '<div class="empty">No lessons in this period.</div>'}</div></section>`;
  html += `<p class="footnote">Lessons count as taught once their time has passed, unless you mark them cancelled or missed. Export gives a spreadsheet of every lesson in this period.</p>`;
  return html + '</main>';
}

/* =========================================================
   Sheets, alerts, toast
   ========================================================= */
let sheet = null;
function openSheet({ title, body, onSave, saveLabel = 'Save', cancelLabel = 'Cancel', onOpen, noSave = false }) {
  const root = $('#sheet-root');
  root.innerHTML = `<div class="backdrop" data-sheet="close"></div><div class="sheet" role="dialog" aria-modal="true" aria-label="${esc(title)}">
    <div class="sheet-head"><div class="grab"></div><button class="nav-btn" data-sheet="close">${esc(cancelLabel)}</button><h2>${esc(title)}</h2>${noSave ? '<span></span>' : `<button class="nav-btn strong" data-sheet="save">${esc(saveLabel)}</button>`}</div>
    <form class="sheet-body" novalidate>${body}<button type="submit" hidden></button></form></div>`;
  root.hidden = false;
  sheet = { onSave, root };
  requestAnimationFrame(() => requestAnimationFrame(() => root.classList.add('open')));
  $('form', root).addEventListener('submit', e => { e.preventDefault(); trySave(); });
  enableDrag(root);
  onOpen && onOpen(root);
}
function trySave() { if (sheet && sheet.onSave && sheet.onSave(sheet.root) !== false) closeSheet(); }
function closeSheet() {
  const root = $('#sheet-root'); if (root.hidden) return;
  root.classList.remove('open'); sheet = null;
  setTimeout(() => { if (!root.classList.contains('open')) { root.hidden = true; root.innerHTML = ''; } }, 380);
}
function enableDrag(root) {
  const head = $('.sheet-head', root), panel = $('.sheet', root); let y0 = null, dy = 0;
  head.addEventListener('touchstart', e => { if (e.target.closest('button')) return; y0 = e.touches[0].clientY; dy = 0; panel.classList.add('dragging'); }, { passive: true });
  head.addEventListener('touchmove', e => { if (y0 === null) return; dy = Math.max(0, e.touches[0].clientY - y0); panel.style.transform = `translateY(${dy}px)`; }, { passive: true });
  head.addEventListener('touchend', () => { if (y0 === null) return; panel.classList.remove('dragging'); panel.style.transform = ''; if (dy > 110) closeSheet(); y0 = null; });
}

function ask({ title, message = '', actions }) {
  return new Promise(resolve => {
    const root = $('#alert-root');
    root.innerHTML = `<div class="backdrop"></div><div class="alert-box" role="alertdialog" aria-modal="true" aria-label="${esc(title)}"><div class="msg"><h3>${esc(title)}</h3>${message ? `<p>${esc(message)}</p>` : ''}</div><div class="acts">${actions.map((a, i) => `<button data-i="${i}" class="${a.style || ''}">${esc(a.label)}</button>`).join('')}</div></div>`;
    root.hidden = false;
    requestAnimationFrame(() => requestAnimationFrame(() => root.classList.add('open')));
    const done = v => { root.classList.remove('open'); setTimeout(() => { root.hidden = true; root.innerHTML = ''; }, 250); resolve(v); };
    root.onclick = e => { const b = e.target.closest('button[data-i]'); if (b) done(actions[+b.dataset.i].value); else if (e.target.classList.contains('backdrop')) done(null); };
    const first = $('button', root); first && first.focus();
  });
}

let toastTimer;
function toast(msg, action) {
  const t = $('#toast');
  t.innerHTML = `<span>${esc(msg)}</span>${action ? `<button type="button">${esc(action.label)}</button>` : ''}`;
  if (action) $('button', t).onclick = () => { action.fn(); t.classList.remove('show'); };
  t.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), action ? 5000 : 2200);
}

/* ---------- Form helpers ---------- */
const field = (label, input) => `<label class="field"><span>${label}</span>${input}</label>`;
const durChips = (val, id) => `<div class="chips" data-dur-for="${id}">${[30, 45, 60, 90].map(m => `<button type="button" data-dur="${m}" aria-pressed="${m === val}">${dur(m)}</button>`).join('')}</div>`;
function wireDurChips(root) {
  $$('[data-dur-for]', root).forEach(box => {
    const input = $('#' + box.dataset.durFor, root);
    const sync = () => $$('button', box).forEach(b => b.setAttribute('aria-pressed', String(+b.dataset.dur === +input.value)));
    box.addEventListener('click', e => { const b = e.target.closest('[data-dur]'); if (!b) return; input.value = b.dataset.dur; sync(); input.dispatchEvent(new Event('input', { bubbles: true })); });
    input.addEventListener('input', sync);
  });
}
const val = (root, id) => ($('#' + id, root)?.value ?? '').trim();
function shake(el) { if (!el) return; el.animate([{ transform: 'translateX(0)' }, { transform: 'translateX(-6px)' }, { transform: 'translateX(6px)' }, { transform: 'translateX(0)' }], { duration: 240 }); el.focus(); }

/* ---------- Lesson sheet ---------- */
function lessonSheet({ id, date, timeStr, studentId, focus } = {}) {
  const existing = id ? db.lessons.find(l => l.id === id) : null;
  const active = db.students.filter(s => !s.archived || (existing && s.id === existing.studentId)).sort((a, b) => a.name.localeCompare(b.name));
  if (!active.length) { toast('Add a student first'); studentSheet(); return; }
  const sId = existing?.studentId || studentId || '';
  const s0 = stu(sId);
  const start = existing ? parseDT(existing.start) : null;
  // New lessons default to the next half hour today, or the start of the teaching day when that has passed.
  let d = existing ? ymd(start) : (date || ymd(new Date()));
  let t = existing ? hm(start) : timeStr;
  if (!t) {
    const n = new Date(); n.setMinutes(n.getMinutes() < 30 ? 30 : 60, 0, 0);
    const dayStartT = `${pad(db.settings.dayStart)}:00`;
    if (d !== ymd(new Date())) t = dayStartT;
    else if (n.getHours() < db.settings.dayStart) t = dayStartT;
    else if (n.getHours() >= db.settings.dayEnd || ymd(n) !== d) { if (!date) d = ymd(addDays(new Date(), 1)); t = dayStartT; }
    else t = hm(n);
  }
  const du = existing?.duration || s0?.defaultDuration || db.settings.defaultDuration;
  const st = existing ? stateOf(existing) : 'upcoming';
  const series = existing?.seriesId ? db.series.find(x => x.id === existing.seriesId) : null;
  const wa = existing && ['upcoming', 'live'].includes(st) ? waLink(stu(existing.studentId), reminderText(existing)) : '';

  const body = `
    <div class="form-group"><div class="group">
      ${field('Student', `<select id="f-student" required><option value="">Choose</option>${active.map(s => `<option value="${s.id}" ${s.id === sId ? 'selected' : ''}>${esc(s.name)}</option>`).join('')}</select>`)}
      ${field('Date', `<input id="f-date" type="date" value="${d}" required>`)}
      ${field('Starts', `<input id="f-time" type="time" value="${t}" step="300" required>`)}
      ${field('Length', `<input id="f-dur" type="number" inputmode="numeric" min="5" max="480" step="5" value="${du}" style="max-width:80px"><span class="suffix">min</span>`)}
      <div class="stack">${durChips(du, 'f-dur')}</div>
    </div></div>
    <div id="clash" hidden></div>
    ${existing ? '' : `<div class="form-group"><div class="group"><label class="field"><span style="flex:1">Repeat every week</span><span class="toggle"><input id="f-repeat" type="checkbox"><i></i></span></label></div><p class="help">Books this time every week. Change or stop it from the student's page.</p></div>`}
    ${existing ? `<div class="form-group"><span class="lab">Status</span><div class="seg" role="group" id="f-status">${[['scheduled', ['taught', 'live'].includes(st) ? 'Happened' : 'Booked'], ['cancelled', 'Cancelled'], ['missed', 'Missed']].map(([k, l]) => `<button type="button" data-status="${k}" aria-pressed="${(existing.status || 'scheduled') === k}">${l}</button>`).join('')}</div><p class="help">Cancelled and missed lessons don't count towards hours taught.</p></div>` : ''}
    <div class="form-group"><span class="lab">Lesson notes</span><div class="group"><label class="field textarea"><textarea id="f-notes" placeholder="What you covered, repertoire, homework…" aria-label="Lesson notes">${esc(existing?.notes || '')}</textarea></label></div></div>
    ${series ? `<p class="help" style="margin:-12px 16px 0;font-size:13px;color:var(--fg-2)">Part of ${esc(seriesLabel(series).day.toLowerCase())} at ${esc(time(parseDT('2000-01-01T' + series.time)))}. Changes here affect this lesson only.</p>` : ''}
    ${wa ? `<a class="btn tint block" href="${esc(wa)}" target="_blank" rel="noopener">${icon('chat')}Send WhatsApp reminder</a>` : ''}
    ${existing ? `<button type="button" class="btn danger block" data-act="delete-lesson" data-id="${existing.id}">Delete lesson</button>` : ''}`;

  openSheet({
    title: existing ? 'Lesson' : 'New Lesson', body, saveLabel: existing ? 'Done' : 'Add',
    onOpen(root) {
      wireDurChips(root);
      const sel = $('#f-student', root);
      sel.addEventListener('change', () => { const s = stu(sel.value); if (s?.defaultDuration && !existing) { $('#f-dur', root).value = s.defaultDuration; $('#f-dur', root).dispatchEvent(new Event('input')); } });
      $('#f-status', root)?.addEventListener('click', e => { const b = e.target.closest('[data-status]'); if (!b) return; $$('[data-status]', root).forEach(x => x.setAttribute('aria-pressed', String(x === b))); });
      const check = () => {
        const box = $('#clash', root); const dd = val(root, 'f-date'), tt = val(root, 'f-time'), m = +val(root, 'f-dur');
        if (!dd || !tt || !m) { box.hidden = true; return; }
        const c = clashes(`${dd}T${tt}`, m, existing?.id);
        box.hidden = !c.length;
        if (c.length) { const l = c[0]; box.innerHTML = `<div class="warning">${icon('alert')}<div><b>Overlaps ${esc(stu(l.studentId)?.name || 'another lesson')}</b><br>${esc(time(parseDT(l.start)))}–${esc(time(lessonEnd(l)))}. You can still save it.</div></div>`; }
      };
      const panel = $('.sheet', root); panel.addEventListener('input', check); panel.addEventListener('change', check); check();
      if (focus === 'notes') setTimeout(() => $('#f-notes', root).focus(), 450);
    },
    onSave(root) {
      const sid = val(root, 'f-student'), dd = val(root, 'f-date'), tt = val(root, 'f-time'), m = Math.round(+val(root, 'f-dur'));
      if (!sid) { shake($('#f-student', root)); toast('Choose a student'); return false; }
      if (!dd || !tt) { shake($('#f-date', root)); toast('Add a date and time'); return false; }
      if (!(m >= 5 && m <= 480)) { shake($('#f-dur', root)); toast('Length must be between 5 and 480 minutes'); return false; }
      const notes = $('#f-notes', root).value.trim();
      if (existing) {
        const status = $('[data-status][aria-pressed="true"]', root)?.dataset.status || 'scheduled';
        Object.assign(existing, { studentId: sid, start: `${dd}T${tt}`, duration: m, notes, status });
        toast('Lesson saved');
      } else if ($('#f-repeat', root)?.checked) {
        addSeries(sid, dd, tt, m);
        const first = db.lessons.find(l => l.studentId === sid && l.start === `${dd}T${tt}`);
        if (first && notes) first.notes = notes;
        toast(`Booked every ${fWdLong.format(parseDate(dd))}`);
      } else {
        db.lessons.push({ id: uid(), studentId: sid, start: `${dd}T${tt}`, duration: m, status: 'scheduled', notes, seriesId: null });
        toast('Lesson booked');
      }
      save(); render();
    },
  });
}
