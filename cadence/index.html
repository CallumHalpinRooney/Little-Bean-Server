/* ---------- Export / import ---------- */
async function shareOrDownload(filename, text, type) {
  const blob = new Blob([text], { type });
  try {
    const file = new File([blob], filename, { type });
    if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], title: filename }); return true; }
  } catch (e) { if (e && e.name === 'AbortError') return false; }
  try {
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = filename;
    document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
    return true;
  } catch (e) { toast('This browser blocked the download'); return false; }
}
function csvFor(lessons) {
  const q = v => { const s = String(v ?? ''); return /[",\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s; };
  const rows = [['Date', 'Start', 'End', 'Student', 'Instrument', 'Minutes', 'Hours', 'Status', 'Rate', 'Amount', 'Notes']];
  for (const l of sortLessons([...lessons])) {
    const s = stu(l.studentId); const d = parseDT(l.start); const st = stateOf(l);
    const status = { taught: 'Taught', live: 'In progress', upcoming: 'Booked', cancelled: 'Cancelled', missed: 'Missed' }[st];
    const rate = Number(s?.rate) || 0;
    rows.push([ymd(d), hm(d), hm(lessonEnd(l)), s?.name || '', s?.instrument || '', l.duration, (l.duration / 60).toFixed(2), status, rate || '', st === 'taught' && rate ? (rate * l.duration / 60).toFixed(2) : '', l.notes || '']);
  }
  return '﻿' + rows.map(r => r.map(q).join(',')).join('\r\n');
}

/* =========================================================
   Actions
   ========================================================= */
function go(tab) { ui.tab = tab; ui.stack = []; ui.anim = 'fade'; try { sessionStorage.setItem('cadence.tab', tab); } catch (e) {} render(); }
function pushStudent(id) { ui.stack.push({ type: 'student', id }); ui.anim = 'push'; try { history.pushState({ cadence: ui.stack.length }, ''); } catch (e) {} render(); }
function popPage() { if (!ui.stack.length) return; ui.stack.pop(); ui.anim = 'pop'; render(); }
window.addEventListener('popstate', () => { if (!$('#sheet-root').hidden) { closeSheet(); return; } if (ui.stack.length) popPage(); });

const actions = {
  tab: d => go(d.tab),
  'goto-cal': () => { ui.cal.date = startOfDay(new Date()); ui.cal.mode = 'day'; go('calendar'); },
  'open-student': d => { closeSheet(); pushStudent(d.id); },
  back: () => { if (ui.stack.length) { try { history.back(); } catch (e) { popPage(); } } },
  'new-lesson': d => lessonSheet({ date: d.date, studentId: d.student }),
  'edit-lesson': d => lessonSheet({ id: d.id, focus: d.focus }),
  'new-student': () => studentSheet(),
  'edit-student': d => studentSheet(d.id),
  'add-series': d => seriesSheet({ studentId: d.student }),
  'edit-series': d => seriesSheet({ id: d.id }),
  settings: () => settingsSheet(),
  'cal-mode': d => { ui.cal.mode = d.mode; try { localStorage.setItem('cadence.calmode', d.mode); } catch (e) {} ui.anim = 'fade'; render(); },
  'cal-today': () => { ui.cal.date = startOfDay(new Date()); render(); },
  'cal-step': d => calStep(+d.dir),
  'cal-pick': d => { ui.cal.date = parseDate(d.date); if (!d.stay && ui.cal.mode === 'week') ui.cal.mode = 'day'; render(); },
  'cal-slot': (d, el, e) => {
    if (e.target.closest('.ev')) return;
    const y = e.clientY - el.getBoundingClientRect().top;
    const mins = Math.max(0, Math.floor((y / +d.hh) * 60 / 15) * 15) + (+d.start) * 60;
    lessonSheet({ date: d.date, timeStr: `${pad(Math.min(23, Math.floor(mins / 60)))}:${pad(mins % 60)}` });
  },
  'hours-range': d => {
    if (d.range === 'term' && !db.settings.termStart) { toast('Add your term dates first'); settingsSheet(); return; }
    ui.hours.range = d.range; ui.hours.anchor = startOfDay(new Date()); render();
  },
  'hours-step': d => { const a = ui.hours.anchor; ui.hours.anchor = ui.hours.range === 'week' ? addDays(a, 7 * d.dir) : new Date(a.getFullYear(), a.getMonth() + +d.dir, 1); render(); },
  'toggle-archived': () => { ui.showArchived = !ui.showArchived; render(); },
  'delete-lesson': d => {
    const i = db.lessons.findIndex(l => l.id === d.id); if (i < 0) return;
    const [removed] = db.lessons.splice(i, 1); save(); closeSheet(); render();
    toast('Lesson deleted', { label: 'Undo', fn: () => { db.lessons.push(removed); save(); render(); } });
  },
  'end-series': async d => {
    const x = db.series.find(z => z.id === d.id); if (!x) return;
    const ok = await ask({ title: 'Stop weekly lessons?', message: 'Future lessons in this slot are removed. Past lessons and their notes stay.', actions: [{ label: 'Stop weekly lessons', value: true, style: 'destructive' }, { label: 'Cancel', value: false, style: 'strong' }] });
    if (!ok) return; endSeries(x.id); save(); closeSheet(); render(); toast('Weekly lessons stopped');
  },
  'archive-student': d => {
    const s = stu(d.id); if (!s) return;
    s.archived = !s.archived;
    if (s.archived) db.series.filter(x => x.studentId === s.id).forEach(x => endSeries(x.id));
    save(); closeSheet(); render(); toast(s.archived ? `${firstName(s.name)} archived` : `${firstName(s.name)} restored`);
  },
  'delete-student': async d => {
    const s = stu(d.id); if (!s) return;
    const n = db.lessons.filter(l => l.studentId === s.id).length;
    const ok = await ask({ title: `Delete ${s.name}?`, message: `This also deletes ${plural(n, 'lesson')} and their notes. To keep their hours, archive instead.`, actions: [{ label: 'Delete', value: true, style: 'destructive' }, { label: 'Cancel', value: false, style: 'strong' }] });
    if (!ok) return;
    db.students = db.students.filter(x => x.id !== s.id);
    db.lessons = db.lessons.filter(l => l.studentId !== s.id);
    db.series = db.series.filter(x => x.studentId !== s.id);
    save(); closeSheet(); ui.stack = []; render(); toast('Student deleted');
  },
  'start-sample': () => { seedSample(); ui.tab = 'today'; ui.anim = 'fade'; render(); },
  'start-empty': () => { db.meta.started = true; save(); ui.tab = 'students'; render(); studentSheet(); },
  'clear-sample': async () => {
    const ok = await ask({ title: 'Clear sample data?', message: 'Removes the sample students and lessons so you can start with your own.', actions: [{ label: 'Clear', value: true, style: 'destructive' }, { label: 'Cancel', value: false, style: 'strong' }] });
    if (!ok) return;
    const meta = { ...db.meta, sample: false, started: true }; db = blank(); db.meta = meta; save(); closeSheet(); ui.tab = 'students'; ui.stack = []; render(); toast('Ready for your students');
  },
  'erase-all': async () => {
    const ok = await ask({ title: 'Erase everything?', message: 'Deletes every student, lesson and note on this phone. This cannot be undone.', actions: [{ label: 'Erase all data', value: true, style: 'destructive' }, { label: 'Cancel', value: false, style: 'strong' }] });
    if (!ok) return;
    db = blank(); save(); closeSheet(); ui.stack = []; ui.tab = 'today'; render();
  },
  'export-backup': async () => {
    const name = `cadence-backup-${ymd(new Date())}.json`;
    const ok = await shareOrDownload(name, JSON.stringify({ app: 'cadence', exportedAt: new Date().toISOString(), ...db }, null, 1), 'application/json');
    if (ok) { db.meta.lastBackup = new Date().toISOString(); save(); toast('Backup created'); }
  },
  'import-backup': () => $('#import-file').click(),
  'export-csv': () => { const r = hoursRange(); const a = ymd(r.from) + 'T00:00', b = ymd(r.to) + 'T00:00'; const ls = db.lessons.filter(l => l.start >= a && l.start < b && stateOf(l) !== 'upcoming'); if (!ls.length) { toast('No lessons to export in this period'); return; } shareOrDownload(`cadence-hours-${r.label.replace(/[^\w]+/g, '-').toLowerCase()}.csv`, csvFor(ls), 'text/csv'); },
  'export-csv-all': () => shareOrDownload(`cadence-lessons-${ymd(new Date())}.csv`, csvFor(db.lessons), 'text/csv'),
  install: async () => { if (!deferredInstall) return; deferredInstall.prompt(); try { await deferredInstall.userChoice; } catch (e) {} deferredInstall = null; render(); },
  'dismiss-install': () => { db.meta.installDismissed = true; save(); render(); },
};
function calStep(dir) {
  const c = ui.cal;
  c.date = c.mode === 'day' ? addDays(c.date, dir) : c.mode === 'week' ? addDays(c.date, 7 * dir) : new Date(c.date.getFullYear(), c.date.getMonth() + dir, Math.min(c.date.getDate(), 28));
  render();
}

$('#import-file').addEventListener('change', async e => {
  const f = e.target.files[0]; e.target.value = ''; if (!f) return;
  try {
    const data = JSON.parse(await f.text());
    if (!Array.isArray(data.students) || !Array.isArray(data.lessons)) throw new Error('shape');
    const when = data.exportedAt ? fDMY.format(new Date(data.exportedAt)) : 'this file';
    const ok = await ask({ title: 'Restore this backup?', message: `${plural(data.students.length, 'student')} and ${plural(data.lessons.length, 'lesson')} from ${when}. This replaces everything currently on this phone.`, actions: [{ label: 'Restore', value: true, style: 'destructive' }, { label: 'Cancel', value: false, style: 'strong' }] });
    if (!ok) return;
    const { app, exportedAt, ...rest } = data;
    db = normalize(rest); db.meta.started = true; db.meta.sample = false; extendSeries(); save(); closeSheet(); ui.stack = []; render(); toast('Backup restored');
  } catch (err) { toast("That file isn't a Cadence backup"); }
});

document.addEventListener('click', e => {
  const s = e.target.closest('[data-sheet]');
  if (s) { e.preventDefault(); s.dataset.sheet === 'save' ? trySave() : closeSheet(); return; }
  const el = e.target.closest('[data-act]');
  if (!el) return;
  const fn = actions[el.dataset.act];
  if (fn) { e.preventDefault(); fn(el.dataset, el, e); }
});
document.addEventListener('input', e => { if (e.target.id === 'student-search') { ui.search = e.target.value; render(); } });
document.addEventListener('keydown', e => { if (e.key === 'Escape') { if (!$('#alert-root').hidden) return; closeSheet(); } });

/* Horizontal swipe on the calendar moves between days, weeks or months. */
let sx = null, sy = null;
document.addEventListener('touchstart', e => { if (ui.tab !== 'calendar' || ui.stack.length || !e.target.closest('.swipe-zone')) { sx = null; return; } sx = e.touches[0].clientX; sy = e.touches[0].clientY; }, { passive: true });
document.addEventListener('touchend', e => {
  if (sx === null) return; const dx = e.changedTouches[0].clientX - sx, dy = e.changedTouches[0].clientY - sy; sx = null;
  if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5) calStep(dx < 0 ? 1 : -1);
}, { passive: true });

function onScroll() { const n = $('.navbar'); if (n) n.classList.toggle('scrolled', window.scrollY > 36); }
window.addEventListener('scroll', onScroll, { passive: true });

/* Keep "now" fresh: lesson states and the now-line update every minute and on return to the app. */
let lastDay = ymd(new Date());
function tick() {
  if (!$('#sheet-root').hidden || !$('#alert-root').hidden) return;
  if (document.activeElement && document.activeElement.id === 'student-search') return;
  const today = ymd(new Date());
  if (today !== lastDay) { lastDay = today; if (extendSeries()) save(); }
  render();
}
setInterval(tick, 60000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) tick(); });

/* =========================================================
   Boot
   ========================================================= */
if (EMBED && !db.meta.started) seedSample();
if (extendSeries()) save();
render();
if (!EMBED) {
  try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch (e) {}
  if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
    window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
  }
}
})();
</script>
</body>
</html>
