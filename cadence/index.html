  const alloc = Number(s.hoursAllocated) || 0;
  html += `<div class="tiles">
    <div class="tile"><span class="k">${term ? 'This term' : 'Total'}</span><span class="v">${hrs(term ? termMin : st.taughtMin)}<small>h</small></span><span class="s">${term && termBooked ? hrs(termBooked) + ' h still booked' : 'taught'}</span></div>
    <div class="tile"><span class="k">Lessons</span><span class="v">${st.taught}</span><span class="s">${hrs(st.taughtMin)} h all time</span></div>
    <div class="tile"><span class="k">Last lesson</span><span class="v" style="font-size:19px;padding-top:5px">${st.last ? esc(relPast(parseDT(st.last.start), now)) : '–'}</span><span class="s">${st.next ? 'Next ' + esc(fDM.format(parseDT(st.next.start))) : 'Nothing booked'}</span></div>
  </div>`;
  if (alloc && term) {
    const pct = clamp(termMin / 60 / alloc * 100, 0, 100);
    html += `<div class="group" style="padding:16px 18px;display:flex;flex-direction:column;gap:10px"><div style="display:flex;justify-content:space-between;font-size:14px"><span class="caps" style="font-size:12px;color:var(--accent)">Term allocation</span><span class="num" style="color:var(--fg-2)">${hrs(termMin)} of ${fNum.format(alloc)} h</span></div><div class="progress" style="height:4px"><i style="width:${pct}%"></i></div></div>`;
  }

  html += `<section class="section"><div class="section-h"><h2>Weekly lessons</h2><button class="link" data-act="add-series" data-student="${s.id}">Add</button></div><div class="group">${slots.length ? slots.map(x => { const sl = seriesLabel(x); return `<button class="row" data-act="edit-series" data-id="${x.id}">${icon('repeat')}<div class="grow"><div class="title">${esc(sl.day)}</div><div class="sub num">${esc(sl.when)}</div></div>${icon('chevR', 'i chev')}</button>`; }).join('') : `<button class="row" data-act="add-series" data-student="${s.id}"><div class="grow"><div class="title" style="color:var(--accent)">Set a weekly lesson</div><div class="sub">Fills the calendar every week automatically</div></div></button>`}</div></section>`;

  const up = list.filter(l => ['upcoming', 'live'].includes(stateOf(l, now)));
  if (up.length) html += `<section class="section"><div class="section-h"><h2>Coming up</h2><span class="meta">${plural(up.length, 'lesson')}</span></div><div class="group">${up.slice(0, 4).map(l => lessonRow(l, { showDate: true })).join('')}</div></section>`;

  if (s.notes) html += `<section class="section"><div class="section-h"><h2>Notes</h2></div><div class="notes-card">${esc(s.notes)}</div></section>`;

  const past = list.filter(l => !['upcoming', 'live'].includes(stateOf(l, now))).reverse();
  html += `<section class="section"><div class="section-h"><h2>History</h2><span class="meta">${plural(st.taught, 'lesson')} taught</span></div>`;
  if (!past.length) html += `<div class="group"><div class="empty">Past lessons and your notes will appear here.</div></div>`;
  else {
    let month = '';
    let groupOpen = false;
    for (const l of past) {
      const m = fMonthYear.format(parseDT(l.start));
      if (m !== month) { if (groupOpen) html += '</div>'; html += `<div class="hist-month">${esc(m)}</div><div class="group">`; month = m; groupOpen = true; }
      html += lessonRow(l, { showDate: true, showNotes: true });
    }
    if (groupOpen) html += '</div>';
  }
  html += `</section>`;
  return html + '</main>';
}

/* ---------- Hours ---------- */
function hoursRange() {
  const h = ui.hours; const a = h.anchor; const today = startOfDay(new Date());
  if (h.range === 'week') { const s = startOfWeek(a); return { from: s, to: addDays(s, 7), label: `${fDM.format(s)} – ${fDM.format(addDays(s, 6))}`, step: true }; }
  if (h.range === 'month') { const s = new Date(a.getFullYear(), a.getMonth(), 1); return { from: s, to: new Date(a.getFullYear(), a.getMonth() + 1, 1), label: fMonthYear.format(s), step: true }; }
  if (h.range === 'term') { const t = termRange(); if (t) return { ...t, label: `${fDM.format(t.from)} – ${db.settings.termEnd ? fDMY.format(parseDate(db.settings.termEnd)) : 'now'}`, step: false }; }
  const first = db.lessons.reduce((m, l) => l.start < m ? l.start : m, ymd(today) + 'T00');
  return { from: parseDate(first.slice(0, 10)), to: addDays(today, 3650), label: 'All time', step: false };
}
function viewHours() {
  const r = hoursRange(); const now = new Date();
  const a = ymd(r.from) + 'T00:00', b = ymd(r.to) + 'T00:00';
  const inRange = db.lessons.filter(l => l.start >= a && l.start < b);
  const per = new Map();
  let taughtMin = 0, taughtN = 0, bookedMin = 0, cancelled = 0, missed = 0, earn = 0;
  for (const l of inRange) {
    const st = stateOf(l, now); const s = stu(l.studentId); if (!s) continue;
    if (!per.has(s.id)) per.set(s.id, { s, min: 0, n: 0, booked: 0, off: 0 });
    const p = per.get(s.id);
    if (st === 'taught') { p.min += l.duration; p.n++; taughtMin += l.duration; taughtN++; earn += (Number(s.rate) || 0) * l.duration / 60; }
    else if (st === 'upcoming' || st === 'live') { p.booked += l.duration; bookedMin += l.duration; }
    else { p.off++; st === 'cancelled' ? cancelled++ : missed++; }
  }
  const rows = [...per.values()].sort((x, y) => y.min - x.min || y.booked - x.booked || x.s.name.localeCompare(y.s.name));
  const max = Math.max(1, ...rows.map(p => p.min + p.booked));
  let html = navbar({ title: 'Hours', left: `<button class="nav-btn" data-act="settings">Settings</button>`, right: `<button class="nav-btn" data-act="export-csv">Export</button>` });
  html += `<header class="large"><p class="eyebrow">Teaching record</p><h1>Hours</h1></header>`;
  html += `<div class="cal-head"><div class="seg" role="group" aria-label="Period">${[['week', 'Week'], ['month', 'Month'], ['term', 'Term'], ['all', 'All']].map(([k, l]) => `<button data-act="hours-range" data-range="${k}" aria-pressed="${ui.hours.range === k}">${l}</button>`).join('')}</div>
    <div class="cal-period"><span class="meta num">${esc(r.label)}</span>${r.step ? `<div class="stepper"><button data-act="hours-step" data-dir="-1" aria-label="Previous">${icon('chevL')}</button><button data-act="hours-step" data-dir="1" aria-label="Next">${icon('chevR')}</button></div>` : ''}</div></div><main>`;
  html += `<div class="summary"><div class="big-stat"><span class="v">${hrs(taughtMin)}</span><span class="u">hours taught</span></div>
    <div class="facts"><span><b>${taughtN}</b> lessons</span>${bookedMin ? `<span><b>${hrs(bookedMin)} h</b> still booked</span>` : ''}${cancelled ? `<span><b>${cancelled}</b> cancelled</span>` : ''}${missed ? `<span><b>${missed}</b> missed</span>` : ''}${earn ? `<span><b>${esc(money(Math.round(earn * 100) / 100))}</b> at your rates</span>` : ''}</div></div>`;
  if (campuses().length && rows.length) {
    const byC = campuses().map(c => { const ps = rows.filter(p => p.s.campusId === c.id); return { c, min: ps.reduce((a, p) => a + p.min, 0), n: ps.reduce((a, p) => a + p.n, 0), booked: ps.reduce((a, p) => a + p.booked, 0) }; });
    html += `<section class="section"><div class="section-h"><h2>By campus</h2></div><div class="group">${byC.map(x => `<div class="row"><div class="grow">${campusTag(x.c)}</div><div class="fig num" style="text-align:right"><b style="display:block;font-size:16px">${hrs(x.min)} h</b><span style="font-size:12px;color:var(--fg-2)">${plural(x.n, 'lesson')}${x.booked ? ` · +${hrs(x.booked)} h` : ''}</span></div></div>`).join('')}</div></section>`;
  }
  html += `<section class="section"><div class="section-h"><h2>By student</h2><span class="meta">${plural(rows.length, 'student')}</span></div><div class="group">${rows.length ? rows.map(p => {
    const alloc = ui.hours.range === 'term' && Number(p.s.hoursAllocated) ? ` of ${fNum.format(p.s.hoursAllocated)} h` : '';
    return `<button class="row hours-row" data-act="open-student" data-id="${p.s.id}" style="--c:${p.s.color}">${avatar(p.s)}<div class="grow"><div class="title">${esc(p.s.name)}</div><div class="hbar"><i style="width:${(p.min / max) * 100}%"></i></div></div><div class="fig"><b>${hrs(p.min)} h${esc(alloc)}</b><span>${plural(p.n, 'lesson')}${p.booked ? ` · +${hrs(p.booked)} h` : ''}</span></div></button>`;
  }).join('') : '<div class="empty">No lessons in this period.</div>'}</div></section>`;
  html += `<p class="footnote">Lessons count as taught once their time has passed, unless you mark them cancelled or missed. Export gives a spreadsheet of every lesson in this period.</p>`;
  return html + '</main>';
}

/* =========================================================
   Sheets, alerts, toast
   ========================================================= */
let sheet = null;
function openSheet({ title, body, onSave, saveLabel = 'Save', cancelLabel = 'Cancel', onOpen, noSave = false }) {
  const root = $('#sheet-root');
  root.innerHTML = `<div class="backdrop" data-sheet="close"></div><div class="sheet" role="dialog" aria-modal="true" aria-label="${esc(title)}">
    <div class="sheet-head"><div class="grab"></div><button class="nav-btn" data-sheet="close">${esc(cancelLabel)}</button><h2>${esc(title)}</h2>${noSave ? '<span></span>' : `<button class="nav-btn strong" data-sheet="save">${esc(saveLabel)}</button>`}</div>
    <form class="sheet-body" novalidate>${body}<button type="submit" hidden></button></form></div>`;
  root.hidden = false;
  sheet = { onSave, root };
  requestAnimationFrame(() => requestAnimationFrame(() => root.classList.add('open')));
  $('form', root).addEventListener('submit', e => { e.preventDefault(); trySave(); });
  wireTimes(root);
  enableDrag(root);
  onOpen && onOpen(root);
}
function trySave() { if (sheet && sheet.onSave && sheet.onSave(sheet.root) !== false) closeSheet(); }
function closeSheet() {
  const root = $('#sheet-root'); if (root.hidden) return;
  root.classList.remove('open'); sheet = null;
  setTimeout(() => { if (!root.classList.contains('open')) { root.hidden = true; root.innerHTML = ''; } }, 380);
}
function enableDrag(root) {
  const head = $('.sheet-head', root), panel = $('.sheet', root); let y0 = null, dy = 0;
  head.addEventListener('touchstart', e => { if (e.target.closest('button')) return; y0 = e.touches[0].clientY; dy = 0; panel.classList.add('dragging'); }, { passive: true });
  head.addEventListener('touchmove', e => { if (y0 === null) return; dy = Math.max(0, e.touches[0].clientY - y0); panel.style.transform = `translateY(${dy}px)`; }, { passive: true });
  head.addEventListener('touchend', () => { if (y0 === null) return; panel.classList.remove('dragging'); panel.style.transform = ''; if (dy > 110) closeSheet(); y0 = null; });
}

function ask({ title, message = '', actions }) {
  return new Promise(resolve => {
    const root = $('#alert-root');
    root.innerHTML = `<div class="backdrop"></div><div class="alert-box" role="alertdialog" aria-modal="true" aria-label="${esc(title)}"><div class="msg"><h3>${esc(title)}</h3>${message ? `<p>${esc(message)}</p>` : ''}</div><div class="acts">${actions.map((a, i) => `<button data-i="${i}" class="${a.style || ''}">${esc(a.label)}</button>`).join('')}</div></div>`;
    root.hidden = false;
    requestAnimationFrame(() => requestAnimationFrame(() => root.classList.add('open')));
    const done = v => { root.classList.remove('open'); setTimeout(() => { root.hidden = true; root.innerHTML = ''; }, 250); resolve(v); };
    root.onclick = e => { const b = e.target.closest('button[data-i]'); if (b) done(actions[+b.dataset.i].value); else if (e.target.classList.contains('backdrop')) done(null); };
    const first = $('button', root); first && first.focus();
  });
}

let toastTimer;
function toast(msg, action) {
  const t = $('#toast');
  t.innerHTML = `<span>${esc(msg)}</span>${action ? `<button type="button">${esc(action.label)}</button>` : ''}`;
  if (action) $('button', t).onclick = () => { action.fn(); t.classList.remove('show'); };
  t.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), action ? 5000 : 2200);
}

/* ---------- Form helpers ---------- */
const field = (label, input) => `<label class="field"><span>${label}</span>${input}</label>`;
/* Time as two plain number lists (hours, minutes) instead of a clock face. A hidden input holds HH:MM. */
function timeField(id, value) {
  const [h, m] = (value || '10:00').split(':').map(Number);
  const hours = []; for (let i = 6; i <= 22; i++) hours.push(i); if (!hours.includes(h)) hours.push(h);
  const mins = []; for (let i = 0; i < 60; i += 5) mins.push(i); if (!mins.includes(m)) mins.push(m);
  return `<span class="tp"><select id="${id}-h" aria-label="Hour">${hours.sort((a, b) => a - b).map(x => `<option value="${x}" ${x === h ? 'selected' : ''}>${pad(x)}</option>`).join('')}</select><b>:</b><select id="${id}-m" aria-label="Minutes">${mins.sort((a, b) => a - b).map(x => `<option value="${x}" ${x === m ? 'selected' : ''}>${pad(x)}</option>`).join('')}</select><input type="hidden" id="${id}" value="${pad(h)}:${pad(m)}"></span>`;
}
function wireTimes(root) {
  $$('.tp', root).forEach(tp => {
    const [hs, ms] = $$('select', tp), hid = $('input', tp);
    const sync = () => { hid.value = `${pad(+hs.value)}:${pad(+ms.value)}`; };
    hs.addEventListener('change', sync); ms.addEventListener('change', sync); hs.addEventListener('input', sync); ms.addEventListener('input', sync);
  });
}
function setTime(root, id, v) {
  const hid = $('#' + id, root); if (!hid) return; hid.value = v;
  const [h, m] = v.split(':').map(Number);
  for (const [sel, x] of [[$('#' + id + '-h', root), h], [$('#' + id + '-m', root), m]]) {
    if (![...sel.options].some(o => +o.value === x)) sel.add(new Option(pad(x), x));
    sel.value = String(x);
  }
}
const durChips = (val, id) => `<div class="chips" data-dur-for="${id}">${[30, 45, 60, 90].map(m => `<button type="button" data-dur="${m}" aria-pressed="${m === val}">${dur(m)}</button>`).join('')}</div>`;
function wireDurChips(root) {
  $$('[data-dur-for]', root).forEach(box => {
    const input = $('#' + box.dataset.durFor, root);
    const sync = () => $$('button', box).forEach(b => b.setAttribute('aria-pressed', String(+b.dataset.dur === +input.value)));
    box.addEventListener('click', e => { const b = e.target.closest('[data-dur]'); if (!b) return; input.value = b.dataset.dur; sync(); input.dispatchEvent(new Event('input', { bubbles: true })); });
    input.addEventListener('input', sync);
  });
}
const val = (root, id) => ($('#' + id, root)?.value ?? '').trim();
function shake(el) { if (!el) return; el.animate([{ transform: 'translateX(0)' }, { transform: 'translateX(-6px)' }, { transform: 'translateX(6px)' }, { transform: 'translateX(0)' }], { duration: 240 }); el.focus(); }

/* ---------- Lesson sheet ---------- */
function lessonSheet({ id, date, timeStr, studentId, focus } = {}) {
  const existing = id ? db.lessons.find(l => l.id === id) : null;
  const active = db.students.filter(s => !s.archived || (existing && s.id === existing.studentId)).sort((a, b) => a.name.localeCompare(b.name));
  if (!active.length) { toast('Add a student first'); studentSheet(); return; }
  const sId = existing?.studentId || studentId || '';
  const s0 = stu(sId);
  const start = existing ? parseDT(existing.start) : null;
  // New lessons default to the next half hour today, or the start of the teaching day when that has passed.
  let d = existing ? ymd(start) : (date || ymd(new Date()));
  let t = existing ? hm(start) : timeStr;
  if (!t) {
    const n = new Date(); n.setMinutes(n.getMinutes() < 30 ? 30 : 60, 0, 0);
    const dayStartT = `${pad(db.settings.dayStart)}:00`;
    if (d !== ymd(new Date())) t = dayStartT;
    else if (n.getHours() < db.settings.dayStart) t = dayStartT;
    else if (n.getHours() >= db.settings.dayEnd || ymd(n) !== d) { if (!date) d = ymd(addDays(new Date(), 1)); t = dayStartT; }
    else t = hm(n);
  }
  // Booking for a student on another campus's day: jump to their next campus day instead.
  const campusDefault = sv => {
    if (existing || date || !sv || !campusDays(campusOfStudent(sv))) return null;
    if (studentDays(sv).includes(parseDate(d).getDay())) return null;
    const nd = nextCampusDate(sv, parseDate(d)); return nd ? { d: ymd(nd), t: `${pad(db.settings.dayStart)}:00` } : null;
  };
  const cd = campusDefault(s0); if (cd) { d = cd.d; t = cd.t; }
  const du = existing?.duration || s0?.defaultDuration || db.settings.defaultDuration;
  const st = existing ? stateOf(existing) : 'upcoming';
  const series = existing?.seriesId ? db.series.find(x => x.id === existing.seriesId) : null;
  const wa = existing && ['upcoming', 'live'].includes(st) ? waLink(stu(existing.studentId), reminderText(existing)) : '';

  const body = `
    ${existing ? `<button type="button" class="btn fill block" data-act="reschedule" data-id="${existing.id}">${icon('move')}Reschedule</button>` : ''}
    <div class="form-group"><div class="group">
      ${field('Student', `<select id="f-student" required><option value="">Choose</option>${active.map(s => `<option value="${s.id}" ${s.id === sId ? 'selected' : ''}>${esc(s.name)}</option>`).join('')}</select>`)}
      ${field('Date', `<input id="f-date" type="date" value="${d}" required>`)}
      ${field('Time', timeField('f-time', t))}
      ${field('Length', `<input id="f-dur" type="number" inputmode="numeric" min="5" max="480" step="5" value="${du}" style="max-width:80px"><span class="suffix">min</span>`)}
      <div class="stack">${durChips(du, 'f-dur')}</div>
    </div></div>
    <div id="clash" hidden></div>
    ${existing?.movedFrom ? `<p class="help" style="margin:-14px 18px 0;font-size:13px;color:var(--accent)">Moved from ${esc(movedLabel(existing))}</p>` : ''}
    ${existing ? '' : `<div class="form-group"><div class="group"><label class="field"><span style="flex:1">Repeat every week</span><span class="toggle"><input id="f-repeat" type="checkbox"><i></i></span></label></div><p class="help">Books this time every week. Change or stop it from the student's page.</p></div>`}
    ${existing && (st === 'taught' || (lessonEnd(existing) <= new Date() && isOff(st))) ? `<div class="form-group"><span class="lab">Did this lesson happen?</span><div class="seg" role="group" id="f-status">${[['scheduled', 'Yes'], ['cancelled', 'Cancelled'], ['missed', 'No-show']].map(([k, l]) => `<button type="button" data-status="${k}" aria-pressed="${(existing.status || 'scheduled') === k}">${l}</button>`).join('')}</div><p class="help">Only lessons that happened count towards your hours.</p></div>` : ''}
    ${existing && lessonEnd(existing) > new Date() && isOff(st) ? `<div class="cancelled-note"><span>This lesson is cancelled.</span><button type="button" class="btn tint" data-act="restore-lesson" data-id="${existing.id}">Restore</button></div>` : ''}
    <div class="form-group"><span class="lab">Lesson notes</span><div class="group"><label class="field textarea"><textarea id="f-notes" placeholder="What you covered, repertoire, homework…" aria-label="Lesson notes">${esc(existing?.notes || '')}</textarea></label></div></div>
    ${series ? `<p class="help" style="margin:-12px 16px 0;font-size:13px;color:var(--fg-2)">Part of ${esc(seriesLabel(series).day.toLowerCase())} at ${esc(time(parseDT('2000-01-01T' + series.time)))}. Changes here affect this lesson only.</p>` : ''}
    ${wa ? `<a class="btn tint block" href="${esc(wa)}" target="_blank" rel="noopener">${icon('chat')}Send WhatsApp reminder</a>` : ''}
    ${existing && lessonEnd(existing) > new Date() && !isOff(st) ? `<button type="button" class="btn danger block" data-act="cancel-lesson" data-id="${existing.id}">Cancel this lesson</button>` : ''}
    ${existing ? `<button type="button" class="btn plain block" style="color:var(--danger);min-height:40px" data-act="delete-lesson" data-id="${existing.id}">Delete lesson</button>` : ''}`;

  openSheet({
    title: existing ? 'Lesson' : 'New Lesson', body, saveLabel: existing ? 'Done' : 'Add',
    onOpen(root) {
      wireDurChips(root);
      const sel = $('#f-student', root);
      sel.addEventListener('change', () => {
        const s = stu(sel.value); if (existing) return;
        if (s?.defaultDuration) { $('#f-dur', root).value = s.defaultDuration; $('#f-dur', root).dispatchEvent(new Event('input')); }
        const cdv = campusDefault(s); if (cdv) { $('#f-date', root).value = cdv.d; setTime(root, 'f-time', cdv.t); }
      });
      $('#f-status', root)?.addEventListener('click', e => { const b = e.target.closest('[data-status]'); if (!b) return; $$('[data-status]', root).forEach(x => x.setAttribute('aria-pressed', String(x === b))); });
      const check = () => {
        const box = $('#clash', root); const dd = val(root, 'f-date'), tt = val(root, 'f-time'), m = +val(root, 'f-dur');
        if (!dd || !tt || !m) { box.hidden = true; return; }
        const c = clashes(`${dd}T${tt}`, m, existing?.id);
        const warns = campusWarnings(stu(val(root, 'f-student')), dd, existing?.id).map(w => warnBox('Different campus', w));
        if (c.length) { const l = c[0]; warns.unshift(warnBox(`Overlaps ${stu(l.studentId)?.name || 'another lesson'}`, `${time(parseDT(l.start))}–${time(lessonEnd(l))}. You can still save it.`)); }
        box.hidden = !warns.length; box.style.cssText = 'display:flex;flex-direction:column;gap:8px'; if (!warns.length) box.style.display = 'none';
        box.innerHTML = warns.join('');
      };
      const panel = $('.sheet', root); panel.addEventListener('input', check); panel.addEventListener('change', check); check();
      if (focus === 'notes') setTimeout(() => $('#f-notes', root).focus(), 450);
    },
    onSave(root) {
      const sid = val(root, 'f-student'), dd = val(root, 'f-date'), tt = val(root, 'f-time'), m = Math.round(+val(root, 'f-dur'));
      if (!sid) { shake($('#f-student', root)); toast('Choose a student'); return false; }
      if (!dd || !tt) { shake($('#f-date', root)); toast('Add a date and time'); return false; }
      if (!(m >= 5 && m <= 480)) { shake($('#f-dur', root)); toast('Length must be between 5 and 480 minutes'); return false; }
      const notes = $('#f-notes', root).value.trim();
      const changed = !existing || existing.start !== `${dd}T${tt}` || existing.studentId !== sid || existing.duration !== m;
      if (changed && !confirmProblems(bookingProblems(stu(sid), `${dd}T${tt}`, m, existing?.id), existing ? 'Save anyway' : 'Book anyway')) return false;
      if (existing) {
        const status = $('[data-status][aria-pressed="true"]', root)?.dataset.status || existing.status || 'scheduled';
        if (notes && !existing.notes) track('notes-written');
        Object.assign(existing, { studentId: sid, duration: m, notes, status });
        const oldStart = moveLesson(existing, `${dd}T${tt}`);
        save(); render();
        if (oldStart) notifyMove(existing, oldStart); else toast('Lesson saved');
        return;
      } else if ($('#f-repeat', root)?.checked) {
        addSeries(sid, dd, tt, m);
        const first = db.lessons.find(l => l.studentId === sid && l.start === `${dd}T${tt}`);
        if (first && notes) first.notes = notes;
        toast(`Booked every ${fWdLong.format(parseDate(dd))}`); track('weekly-lesson-set');
      } else {
        db.lessons.push({ id: uid(), studentId: sid, start: `${dd}T${tt}`, duration: m, status: 'scheduled', notes, seriesId: null });
        toast('Lesson booked'); track('lesson-booked');
      }
      save(); render();
    },
  });
}

/* ---------- Rescheduling ---------- */
function movedLabel(l) {
  const a = parseDT(l.movedFrom);
  return sameDay(a, parseDT(l.start)) ? time(a) : `${fDayShort.format(a)}, ${time(a)}`;
}
/* Moves a lesson and remembers where it was first booked. Returns the previous start, or null if unchanged. */
function moveLesson(l, newStart) {
  const old = l.start;
  if (old === newStart) return null;
  track('lesson-moved');
  if (!l.movedFrom) l.movedFrom = old;
  else if (l.movedFrom === newStart) delete l.movedFrom;
  l.start = newStart;
  return old;
}
function moveText(l, oldStart) {
  const s = stu(l.studentId); const a = parseDT(oldStart), b = parseDT(l.start);
  const what = s?.instrument ? `${s.instrument.toLowerCase()} lesson` : 'lesson';
  const hi = `Hi ${firstName(s?.name)}`;
  if (sameDay(a, b)) return `${hi}, your ${what} on ${fDayLong.format(b)} has moved from ${time(a)} to ${time(b)}. See you then!`;
  return `${hi}, your ${what} has moved from ${fDayLong.format(a)} at ${time(a)} to ${fDayLong.format(b)} at ${time(b)}. See you then!`;
}
/* Free stretches of the teaching day, long enough for this lesson, over the next few days. */
function freeGaps(l, from, days = 7, allowed = WEEK) {
  const out = []; const now = new Date(); const S = db.settings;
  for (let i = 0; i < days; i++) {
    const d = addDays(from, i);
    if (!allowed.includes(d.getDay())) continue;
    let ws = new Date(d); ws.setHours(S.dayStart, 0, 0, 0);
    const we = new Date(d); we.setHours(S.dayEnd, 0, 0, 0);
    if (we <= now) continue;
    if (ws < now) { ws = new Date(now); ws.setMinutes(Math.ceil((ws.getMinutes() + 1) / 15) * 15, 0, 0); }
    const busy = lessonsBetween(d, addDays(d, 1)).filter(x => x.id !== l.id && !isOff(stateOf(x)))
      .map(x => [parseDT(x.start), lessonEnd(x)]);
    let cur = ws;
    for (const [bs, be] of [...busy, [we, we]]) {
      const end = bs < we ? bs : we;
      if (end - cur >= l.duration * 60000) out.push({ start: new Date(cur), end: new Date(end) });
      if (be > cur) cur = be;
      if (cur >= we) break;
    }
  }
  return out;
}
function rescheduleSheet(id) {
  const l = db.lessons.find(x => x.id === id); if (!l) return;
  const s = stu(l.studentId); const cur = parseDT(l.start); const now = new Date();
  // A lesson already in the past is moved forward from today, at its usual time.
  const base = cur > now ? cur : (() => { const b = startOfDay(now); b.setHours(cur.getHours(), cur.getMinutes()); return b; })();
  const at = n => `${ymd(addDays(base, n))}T${hm(base)}`;
  const sc = campusOfStudent(s); const scDays = campusDays(sc);
  // With a campus, "next day" means the student's next campus day; skip it if that is just next week.
  const nd = scDays ? nextCampusDate(s, base) : addDays(base, 1);
  const ndStart = nd ? `${ymd(nd)}T${hm(base)}` : null;
  const opts = [
    { k: 'week', label: 'Same time next week', start: at(7) },
    ...(ndStart && ndStart !== at(7) ? [{ k: 'day', label: scDays ? `Next ${sc.name} day, same time` : sameDay(base, now) ? 'Tomorrow, same time' : 'Next day, same time', start: ndStart }] : []),
    { k: 'pick', label: 'Pick a new time' },
  ];
  const clashName = c => c.studentId === l.studentId ? `${firstName(s?.name)} already has a lesson then` : `clashes with ${firstName(stu(c.studentId)?.name)}`;
  const firstFree = (opts.find(o => o.start && !clashes(o.start, l.duration, l.id).length) || opts[0]).k;
  const optSub = o => {
    if (!o.start) return 'Choose a day and time, or a free slot';
    const d = parseDT(o.start); const c = clashes(o.start, l.duration, l.id);
    return c.length ? `<span class="warn">${esc(fDayShort.format(d))}, ${esc(time(d))} · ${esc(clashName(c[0]))}</span>` : `${esc(fDayShort.format(d))}, ${esc(time(d))}`;
  };
  const gaps = freeGaps(l, startOfDay(base > now ? base : now), scDays ? 14 : 7, scDays || WEEK).slice(0, 14);
  const body = `
    <div class="lesson-head">${avatar(s)}<div style="min-width:0"><div class="title">${esc(s?.name || 'Lesson')}</div><div class="sub num">${esc(fDayShort.format(cur))}, ${esc(time(cur))} · ${esc(dur(l.duration))}</div></div></div>
    <div class="form-group"><span class="lab">Move to</span><div class="group" id="opts">${opts.map(o => `
      <button type="button" class="row opt" data-opt="${o.k}" aria-pressed="${o.k === firstFree}"><span class="radio"></span><div class="grow"><div class="title">${esc(o.label)}</div><div class="sub num">${optSub(o)}</div></div></button>`).join('')}
    </div></div>
    <div id="pick" hidden>
      <div class="form-group"><div class="group">
        ${field('Date', `<input id="r-date" type="date" value="${ymd(cur > now ? cur : now)}">`)}
        ${field('Time', timeField('r-time', hm(cur)))}
      </div></div>
      <div class="form-group" style="margin-top:20px"><span class="lab">${scDays ? `Free on ${esc(sc.name)} days` : 'Free in the next week'}</span>
        ${gaps.length ? `<div class="chips" id="gaps" style="padding:0 4px">${gaps.map(g => `<button type="button" data-gap="${ymd(g.start)}T${hm(g.start)}">${esc(fWd.format(g.start))} ${g.start.getDate()} · ${esc(time(g.start))}–${esc(time(g.end))}</button>`).join('')}</div>`
          : `<p class="help">No free gaps of ${esc(dur(l.duration))} in your teaching hours over the next week.</p>`}
        <p class="help">Tap a free slot to use its start time.</p>
      </div>
    </div>
    <div id="r-clash" hidden></div>`;
  openSheet({
    title: 'Reschedule', body, saveLabel: 'Move',
    onOpen(root) {
      const target = () => { const k = $('.opt[aria-pressed="true"]', root).dataset.opt; return k === 'pick' ? `${val(root, 'r-date')}T${val(root, 'r-time')}` : opts.find(o => o.k === k).start; };
      const check = () => {
        const box = $('#r-clash', root); const t = target();
        const ok = t && !t.startsWith('T') && !t.endsWith('T');
        const c = ok ? clashes(t, l.duration, l.id) : [];
        const warns = ok ? campusWarnings(s, t.slice(0, 10), l.id).map(w => warnBox('Different campus', w)) : [];
        if (c.length) warns.unshift(warnBox(c[0].studentId === l.studentId ? clashName(c[0]) : `Overlaps ${stu(c[0].studentId)?.name || 'another lesson'}`, `${time(parseDT(c[0].start))}–${time(lessonEnd(c[0]))}. You can still move it.`));
        box.hidden = !warns.length; box.style.cssText = warns.length ? 'display:flex;flex-direction:column;gap:8px' : 'display:none';
        box.innerHTML = warns.join('');
        $$('#gaps button', root).forEach(b => b.setAttribute('aria-pressed', String(b.dataset.gap === t)));
      };
      $('#opts', root).addEventListener('click', e => {
        const b = e.target.closest('.opt'); if (!b) return;
        $$('.opt', root).forEach(x => x.setAttribute('aria-pressed', String(x === b)));
        $('#pick', root).hidden = b.dataset.opt !== 'pick'; check();
      });
      $('#gaps', root)?.addEventListener('click', e => {
        const b = e.target.closest('[data-gap]'); if (!b) return;
        const [dd, tt] = b.dataset.gap.split('T'); $('#r-date', root).value = dd; setTime(root, 'r-time', tt); check();
      });
      $('#pick', root).addEventListener('input', check); $('#pick', root).addEventListener('change', check);
      check();
    },
    onSave(root) {
      const k = $('.opt[aria-pressed="true"]', root).dataset.opt;
      const t = k === 'pick' ? `${val(root, 'r-date')}T${val(root, 'r-time')}` : opts.find(o => o.k === k).start;
      if (k === 'pick' && (!val(root, 'r-date') || !val(root, 'r-time'))) { shake($('#r-date', root)); toast('Choose a day and time'); return false; }
      if (t !== l.start && !confirmProblems(bookingProblems(s, t, l.duration, l.id), 'Move anyway')) return false;
      const oldStart = moveLesson(l, t);
      if (!oldStart) { toast("That's the time it's already booked for"); return false; }
      if (l.status === 'cancelled' || l.status === 'missed') l.status = 'scheduled';
      save(); render();
      notifyMove(l, oldStart);
    },
  });
}

      <button type="button" class="row" data-act="import-backup">${icon('repeat')}<div class="grow"><div class="title">Restore from a backup</div><div class="sub">Replaces what's on this phone</div></div></button>
      <button type="button" class="row" data-act="export-csv-all">${icon('chart')}<div class="grow"><div class="title">Export all lessons</div><div class="sub">Spreadsheet (CSV)</div></div></button>
    </div><p class="help">Cadence keeps everything on this phone, with no account. Save a backup to Files or send it to yourself now and then, so you have a copy if you change phone.</p></div>
    <div class="form-group"><span class="lab">Usage counts</span><div class="group"><label class="field"><span style="flex:1">Share anonymous usage counts</span><span class="toggle"><input id="s-count" type="checkbox" ${db.meta.analyticsOff ? '' : 'checked'}><i></i></span></label></div><p class="help">Lets Callum see that Cadence is being used, for example "app opened" or "lesson booked". It never sends names, phone numbers, notes or times.</p></div>
    <div class="form-group"><div class="group">
      ${db.meta.sample ? `<button type="button" class="row" data-act="clear-sample"><div class="grow"><div class="title" style="color:var(--accent)">Clear sample data</div></div></button>` : ''}
      <button type="button" class="row" data-act="erase-all"><div class="grow"><div class="title" style="color:var(--danger)">Erase all data</div></div></button>
    </div></div>
    <p class="help" style="text-align:center;color:var(--fg-3);font-size:13px;margin:0">Cadence · ${db.students.length} students · ${db.lessons.length} lessons stored</p>`;
  openSheet({
    title: 'Settings', body, saveLabel: 'Done', cancelLabel: 'Close',
    onSave(root) {
      const ts = val(root, 's-ts'), te = val(root, 's-te');
      if (ts && te && te < ts) { toast('Term must end after it starts'); return false; }
      const countOn = $('#s-count', root).checked;
      if (!countOn && !db.meta.analyticsOff) track('counts-turned-off');
      db.meta.analyticsOff = !countOn;
      Object.assign(db.settings, {
        termStart: ts, termEnd: te, dayStart: +val(root, 's-ds'), dayEnd: +val(root, 's-de'),
        staleDays: clamp(Math.round(+val(root, 's-stale')) || 14, 3, 90), currency: val(root, 's-cur'), country: val(root, 's-cc').replace(/\D/g, '') || '353',
      });
      save(); render();
    },
  });
}

/* ---------- Guide ---------- */
function guideSheet() {
  const items = [
    ['today', 'Today', 'Shows your next lesson and today\'s timetable. Tap any lesson to open it.'],
    ['students', 'Add a student', 'Tap Students, then + Student. Choose their campus and their weekly day and time, and their lessons appear in the calendar every week.'],
    ['plus', 'Book a one-off lesson', 'Tap + Lesson at the top of Today or Calendar.'],
    ['move', 'Move a lesson', 'Open the lesson and tap Reschedule. Pick a new time, then send the WhatsApp message Cadence writes for you.'],
    ['x', 'Cancel a lesson', 'Open the lesson and tap Cancel this lesson. Cancelled lessons don\'t count towards your hours.'],
    ['note', 'Lesson notes', 'Open a lesson to write what you covered. Every note is kept on the student\'s page.'],
    ['alert', 'Two campuses', 'Each day belongs to one campus. If a lesson would put you at both on the same day, Cadence asks before saving.'],
    ['hours', 'Hours', 'The Hours tab adds up what you have taught this week, month or term, per student and per campus.'],
    ['lock', 'Your information', 'Everything stays on this phone. Use Settings, then Back up, now and then to keep a copy. Cadence only tells Callum when things happen, like "lesson booked", never any names or details. You can turn that off in Settings.'],
  ];
  openSheet({
    title: 'How It Works', noSave: true, cancelLabel: 'Close',
    body: `<div class="guide">${items.map(([ic, t, d]) => `<div class="g">${icon(ic)}<div><b>${esc(t)}</b><span>${esc(d)}</span></div></div>`).join('')}</div>`,
  });
  if (!db.meta.guideSeen) { db.meta.guideSeen = true; save(); render(); }
}

/* ---------- Campus sheet ---------- */
function campusSheet(id) {
  const c = id ? campusById(id) : null; const all = campuses();
  const color = c?.color || CAMPUS_COLORS[all.length % CAMPUS_COLORS.length];
  const owner = w => all.find(x => x !== c && (x.days || []).includes(w));
  const body = `
    <div class="form-group"><div class="group">
      ${field('Name', `<input id="c-name" type="text" value="${esc(c?.name || '')}" placeholder="${all.length ? 'e.g. North Campus' : 'e.g. City Campus'}" autocapitalize="words" autocomplete="off">`)}
    </div></div>
    <div class="form-group"><span class="lab">Days you teach here</span>
      <div class="days-pick" id="c-days">${WEEK.map(w => `<button type="button" data-w="${w}" aria-pressed="${(c?.days || []).includes(w)}">${esc(dayName(w).slice(0, 3))}${owner(w) ? `<small>${esc(owner(w).name.split(' ')[0])}</small>` : ''}</button>`).join('')}</div>
      <p class="help">Each day belongs to one campus. Picking a day another campus has moves it here.</p></div>
    <div class="form-group"><span class="lab">Colour</span><div class="group"><div class="stack"><div class="swatches" role="radiogroup" aria-label="Colour">${CAMPUS_COLORS.map((k, i) => `<label style="--c:${k}" aria-label="Colour ${i + 1}"><input type="radio" name="c-color" value="${k}" ${k === color ? 'checked' : ''}></label>`).join('')}</div></div></div></div>
    ${c ? `<button type="button" class="btn danger block" data-act="delete-campus" data-id="${c.id}">Delete campus</button>` : ''}`;
  openSheet({
    title: c ? 'Campus' : 'New Campus', body, saveLabel: c ? 'Done' : 'Add',
    onOpen(root) {
      $('#c-days', root).addEventListener('click', e => { const b = e.target.closest('[data-w]'); if (b) b.setAttribute('aria-pressed', String(b.getAttribute('aria-pressed') !== 'true')); });
      if (!c) setTimeout(() => $('#c-name', root).focus(), 420);
    },
    onSave(root) {
      const name = val(root, 'c-name');
      if (!name) { shake($('#c-name', root)); toast('Add a name'); return false; }
      const days = $$('#c-days [aria-pressed="true"]', root).map(b => +b.dataset.w);
      for (const x of all) if (x !== c) x.days = (x.days || []).filter(w => !days.includes(w));
      const data = { name, days, color: $('input[name="c-color"]:checked', root)?.value || color };
      if (c) Object.assign(c, data); else db.settings.campuses = [...all, { id: uid(), ...data }];
      if (!c) track('campus-added');
      const n = autoAssignCampuses();
      save(); render();
      toast(n ? `${name} saved · ${plural(n, 'student')} placed by their weekly day` : `${name} saved`);
      setTimeout(settingsSheet, 430);
    },
  });
}

/* ---------- Export / import ---------- */
async function shareOrDownload(filename, text, type) {
  const blob = new Blob([text], { type });
  try {
    const file = new File([blob], filename, { type });
    if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], title: filename }); return true; }
  } catch (e) { if (e && e.name === 'AbortError') return false; }
  try {
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = filename;
    document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
    return true;
  } catch (e) { toast('This browser blocked the download'); return false; }
}
function csvFor(lessons) {
  const q = v => { const s = String(v ?? ''); return /[",\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s; };
  const rows = [['Date', 'Start', 'End', 'Student', 'Instrument', 'Campus', 'Minutes', 'Hours', 'Status', 'Rate', 'Amount', 'Notes']];
  for (const l of sortLessons([...lessons])) {
    const s = stu(l.studentId); const d = parseDT(l.start); const st = stateOf(l);
    const status = { taught: 'Taught', live: 'In progress', upcoming: 'Booked', cancelled: 'Cancelled', missed: 'Missed' }[st];
    const rate = Number(s?.rate) || 0;
    rows.push([ymd(d), hm(d), hm(lessonEnd(l)), s?.name || '', s?.instrument || '', campusOfStudent(s)?.name || '', l.duration, (l.duration / 60).toFixed(2), status, rate || '', st === 'taught' && rate ? (rate * l.duration / 60).toFixed(2) : '', l.notes || '']);
  }
  return '﻿' + rows.map(r => r.map(q).join(',')).join('\r\n');
}

/* =========================================================
   Actions
   ========================================================= */
function go(tab) { ui.tab = tab; ui.stack = []; ui.anim = 'fade'; try { sessionStorage.setItem('cadence.tab', tab); } catch (e) {} render(); }
function pushStudent(id) { ui.stack.push({ type: 'student', id }); ui.anim = 'push'; try { history.pushState({ cadence: ui.stack.length }, ''); } catch (e) {} render(); }
function popPage() { if (!ui.stack.length) return; ui.stack.pop(); ui.anim = 'pop'; render(); }
window.addEventListener('popstate', () => { if (!$('#sheet-root').hidden) { closeSheet(); return; } if (ui.stack.length) popPage(); });

const actions = {
  tab: d => go(d.tab),
  'goto-cal': () => { ui.cal.date = startOfDay(new Date()); ui.cal.mode = 'day'; go('calendar'); },
  'open-student': d => { closeSheet(); pushStudent(d.id); },
  back: () => { if (ui.stack.length) { try { history.back(); } catch (e) { popPage(); } } },
  'new-lesson': d => lessonSheet({ date: d.date, studentId: d.student }),
  'edit-lesson': d => lessonSheet({ id: d.id, focus: d.focus }),
  reschedule: d => rescheduleSheet(d.id),
  'edit-campus': d => campusSheet(d.id),
  guide: () => { guideSheet(); track('guide-opened'); },
  'cancel-lesson': d => {
    const l = db.lessons.find(x => x.id === d.id); if (!l) return;
    l.status = 'cancelled'; save(); closeSheet(); render(); track('lesson-cancelled');
    toast('Lesson cancelled', { label: 'Undo', fn: () => { l.status = 'scheduled'; save(); render(); } });
    const s = stu(l.studentId); const at = parseDT(l.start);
    notifySheet({ title: 'Lesson Cancelled', s, rows: [{ k: 'Was', v: `${fDayLong.format(at)}, ${time(at)}`, cls: 'was' }],
      text: `Hi ${firstName(s?.name)}, I'm sorry but I need to cancel your ${s?.instrument ? s.instrument.toLowerCase() + ' ' : ''}lesson on ${fDayLong.format(at)} at ${time(at)}. I'll be in touch to rearrange.` });
  },
  'restore-lesson': d => { const l = db.lessons.find(x => x.id === d.id); if (!l) return; l.status = 'scheduled'; save(); closeSheet(); render(); toast('Lesson restored'); },
  'dismiss-campus': () => { db.meta.campusDismissed = true; save(); render(); },
  'delete-campus': async d => {
    const c = campusById(d.id); if (!c) return;
    const n = db.students.filter(x => x.campusId === c.id).length;
    const ok = await ask({ title: `Delete ${c.name}?`, message: n ? `${plural(n, 'student')} will have no campus. Their lessons stay as they are.` : 'Its days become free.', actions: [{ label: 'Delete', value: true, style: 'destructive' }, { label: 'Cancel', value: false, style: 'strong' }] });
    if (!ok) return;
    db.settings.campuses = campuses().filter(x => x.id !== c.id);
    db.students.forEach(x => { if (x.campusId === c.id) x.campusId = ''; });
    save(); closeSheet(); render(); toast(`${c.name} deleted`); setTimeout(settingsSheet, 430);
  },
  'new-student': () => studentSheet(),
  'edit-student': d => studentSheet(d.id),
  'add-series': d => seriesSheet({ studentId: d.student }),
  'edit-series': d => seriesSheet({ id: d.id }),
  settings: () => settingsSheet(),
  'cal-mode': d => { ui.cal.mode = d.mode; try { localStorage.setItem('cadence.calmode', d.mode); } catch (e) {} ui.anim = 'fade'; render(); },
  'cal-today': () => { ui.cal.date = startOfDay(new Date()); render(); },
  'cal-step': d => calStep(+d.dir),
  'cal-pick': d => { ui.cal.date = parseDate(d.date); if (!d.stay && ui.cal.mode === 'week') ui.cal.mode = 'day'; render(); },
  'cal-slot': (d, el, e) => {
    if (e.target.closest('.ev')) return;
    const y = e.clientY - el.getBoundingClientRect().top;
    const mins = Math.max(0, Math.floor((y / +d.hh) * 60 / 15) * 15) + (+d.start) * 60;
    lessonSheet({ date: d.date, timeStr: `${pad(Math.min(23, Math.floor(mins / 60)))}:${pad(mins % 60)}` });
  },
  'hours-range': d => {
    if (d.range === 'term' && !db.settings.termStart) { toast('Add your term dates first'); settingsSheet(); return; }
    ui.hours.range = d.range; ui.hours.anchor = startOfDay(new Date()); render();
  },
  'hours-step': d => { const a = ui.hours.anchor; ui.hours.anchor = ui.hours.range === 'week' ? addDays(a, 7 * d.dir) : new Date(a.getFullYear(), a.getMonth() + +d.dir, 1); render(); },
  'toggle-archived': () => { ui.showArchived = !ui.showArchived; render(); },
  'delete-lesson': d => {
    const i = db.lessons.findIndex(l => l.id === d.id); if (i < 0) return;
    const [removed] = db.lessons.splice(i, 1); save(); closeSheet(); render();
    toast('Lesson deleted', { label: 'Undo', fn: () => { db.lessons.push(removed); save(); render(); } });
  },
  'end-series': async d => {
    const x = db.series.find(z => z.id === d.id); if (!x) return;
    const ok = await ask({ title: 'Stop weekly lessons?', message: 'Future lessons in this slot are removed. Past lessons and their notes stay.', actions: [{ label: 'Stop weekly lessons', value: true, style: 'destructive' }, { label: 'Cancel', value: false, style: 'strong' }] });
    if (!ok) return; endSeries(x.id); save(); closeSheet(); render(); toast('Weekly lessons stopped');
  },
  'archive-student': d => {
    const s = stu(d.id); if (!s) return;
    s.archived = !s.archived;
    if (s.archived) db.series.filter(x => x.studentId === s.id).forEach(x => endSeries(x.id));
    save(); closeSheet(); render(); toast(s.archived ? `${firstName(s.name)} archived` : `${firstName(s.name)} restored`);
  },
  'delete-student': async d => {
    const s = stu(d.id); if (!s) return;
    const n = db.lessons.filter(l => l.studentId === s.id).length;
    const ok = await ask({ title: `Delete ${s.name}?`, message: `This also deletes ${plural(n, 'lesson')} and their notes. To keep their hours, archive instead.`, actions: [{ label: 'Delete', value: true, style: 'destructive' }, { label: 'Cancel', value: false, style: 'strong' }] });
    if (!ok) return;
    db.students = db.students.filter(x => x.id !== s.id);
    db.lessons = db.lessons.filter(l => l.studentId !== s.id);
    db.series = db.series.filter(x => x.studentId !== s.id);
    save(); closeSheet(); ui.stack = []; render(); toast('Student deleted');
  },
  'start-sample': () => { track('tried-sample'); seedSample(); ui.tab = 'today'; ui.anim = 'fade'; render(); },
  'start-empty': () => { db.meta.started = true; save(); track('started-own-data'); ui.tab = 'students'; render(); studentSheet(); },
  'clear-sample': async () => {
    const ok = await ask({ title: 'Clear sample data?', message: 'Removes the sample students and lessons so you can start with your own.', actions: [{ label: 'Clear', value: true, style: 'destructive' }, { label: 'Cancel', value: false, style: 'strong' }] });
    if (!ok) return;
    const meta = { ...db.meta, sample: false, started: true }; db = blank(); db.meta = meta; save(); track('cleared-sample'); closeSheet(); ui.tab = 'students'; ui.stack = []; render(); toast('Ready for your students');
  },
  'erase-all': async () => {
    const ok = await ask({ title: 'Erase everything?', message: 'Deletes every student, lesson and note on this phone. This cannot be undone.', actions: [{ label: 'Erase all data', value: true, style: 'destructive' }, { label: 'Cancel', value: false, style: 'strong' }] });
    if (!ok) return;
    db = blank(); save(); closeSheet(); ui.stack = []; ui.tab = 'today'; render();
  },
  'export-backup': async () => {
    const name = `cadence-backup-${ymd(new Date())}.json`;
    const ok = await shareOrDownload(name, JSON.stringify({ app: 'cadence', exportedAt: new Date().toISOString(), ...db }, null, 1), 'application/json');
    if (ok) { db.meta.lastBackup = new Date().toISOString(); save(); toast('Backup created'); track('backup-made'); }
  },
  'import-backup': () => $('#import-file').click(),
  'export-csv': () => { track('hours-exported'); const r = hoursRange(); const a = ymd(r.from) + 'T00:00', b = ymd(r.to) + 'T00:00'; const ls = db.lessons.filter(l => l.start >= a && l.start < b && stateOf(l) !== 'upcoming'); if (!ls.length) { toast('No lessons to export in this period'); return; } shareOrDownload(`cadence-hours-${r.label.replace(/[^\w]+/g, '-').toLowerCase()}.csv`, csvFor(ls), 'text/csv'); },
  'export-csv-all': () => { track('hours-exported'); shareOrDownload(`cadence-lessons-${ymd(new Date())}.csv`, csvFor(db.lessons), 'text/csv'); },
  install: async () => { if (!deferredInstall) return; deferredInstall.prompt(); try { await deferredInstall.userChoice; } catch (e) {} deferredInstall = null; render(); },
  'dismiss-install': () => { db.meta.installDismissed = true; save(); render(); },
};
function calStep(dir) {
  const c = ui.cal;
  c.date = c.mode === 'day' ? addDays(c.date, dir) : c.mode === 'week' ? addDays(c.date, 7 * dir) : new Date(c.date.getFullYear(), c.date.getMonth() + dir, Math.min(c.date.getDate(), 28));
  render();
}

$('#import-file').addEventListener('change', async e => {
  const f = e.target.files[0]; e.target.value = ''; if (!f) return;
  try {
    const data = JSON.parse(await f.text());
    if (!Array.isArray(data.students) || !Array.isArray(data.lessons)) throw new Error('shape');
    const when = data.exportedAt ? fDMY.format(new Date(data.exportedAt)) : 'this file';
    const ok = await ask({ title: 'Restore this backup?', message: `${plural(data.students.length, 'student')} and ${plural(data.lessons.length, 'lesson')} from ${when}. This replaces everything currently on this phone.`, actions: [{ label: 'Restore', value: true, style: 'destructive' }, { label: 'Cancel', value: false, style: 'strong' }] });
    if (!ok) return;
    const { app, exportedAt, ...rest } = data;
    db = normalize(rest); db.meta.started = true; db.meta.sample = false; extendSeries(); save(); closeSheet(); ui.stack = []; render(); toast('Backup restored');
  } catch (err) { toast("That file isn't a Cadence backup"); }
});

document.addEventListener('click', e => {
  const s = e.target.closest('[data-sheet]');
  if (s) { e.preventDefault(); s.dataset.sheet === 'save' ? trySave() : closeSheet(); return; }
  const el = e.target.closest('[data-act]');
  if (!el) return;
  const fn = actions[el.dataset.act];
  if (fn) { e.preventDefault(); fn(el.dataset, el, e); }
});
document.addEventListener('input', e => { if (e.target.id === 'student-search') { ui.search = e.target.value; render(); } });
document.addEventListener('keydown', e => { if (e.key === 'Escape') { if (!$('#alert-root').hidden) return; closeSheet(); } });

/* Horizontal swipe on the calendar moves between days, weeks or months. */
let sx = null, sy = null;
document.addEventListener('touchstart', e => { if (ui.tab !== 'calendar' || ui.stack.length || !e.target.closest('.swipe-zone')) { sx = null; return; } sx = e.touches[0].clientX; sy = e.touches[0].clientY; }, { passive: true });
document.addEventListener('touchend', e => {
  if (sx === null) return; const dx = e.changedTouches[0].clientX - sx, dy = e.changedTouches[0].clientY - sy; sx = null;
  if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5) calStep(dx < 0 ? 1 : -1);
}, { passive: true });

function onScroll() { const n = $('.navbar'); if (n) n.classList.toggle('scrolled', window.scrollY > 36); }
window.addEventListener('scroll', onScroll, { passive: true });

/* Keep "now" fresh: lesson states and the now-line update every minute and on return to the app. */
let lastDay = ymd(new Date());
function tick() {
  if (!$('#sheet-root').hidden || !$('#alert-root').hidden) return;
  if (document.activeElement && document.activeElement.id === 'student-search') return;
  const today = ymd(new Date());
  if (today !== lastDay) { lastDay = today; if (extendSeries()) save(); }
  render();
}
setInterval(tick, 60000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) { tick(); trackOpen(); } });

/* =========================================================
   Boot
   ========================================================= */
if (EMBED && !db.meta.started) seedSample();
trackOpen();
if (extendSeries()) save();
render();
if (!EMBED) {
  try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch (e) {}
  if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
    window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
  }
}
})();
</script>
