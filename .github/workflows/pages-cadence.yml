name: Publish Cadence app to GitHub Pages

# Serves cadence/ at https://callumhalpinrooney.github.io/Little-Bean-Server/
#
# One-time setup: repository Settings → Pages → Build and deployment →
# Source: "GitHub Actions". Then push to main or run this workflow from the Actions tab.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["cadence/**", ".github/workflows/pages-cadence.yml"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: cadence
      - id: deployment
        uses: actions/deploy-pages@v4
